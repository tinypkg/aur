name: Update docker-sbx-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.38.0). Leave empty to auto-detect latest version."
        required: false
        type: string
      force:
        description: "Force a same-version update (bump pkgrel after the initial AUR publish)"
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: "Allow an explicitly requested version to be older than the current package"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-docker-sbx-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
            API_URL="https://api.github.com/repos/docker/sbx-releases/releases/tags/v${VERSION}"
          else
            API_URL="https://api.github.com/repos/docker/sbx-releases/releases/latest"
          fi

          RELEASE=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL")
          TAG=$(jq -er '.tag_name | strings | select(length > 1)' <<<"$RELEASE")
          VERSION="${TAG#v}"

          if [[ "$TAG" != "v${VERSION}" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported release tag: $TAG" >&2
            exit 1
          fi
          if [[ -n "$INPUT_VERSION" && "${INPUT_VERSION#v}" != "$VERSION" ]]; then
            echo "Requested version does not match release tag: $TAG" >&2
            exit 1
          fi

          for asset in \
            DockerSandboxes-linux-amd64.tar.gz \
            DockerSandboxes-linux-arm64.tar.gz; do
            URL=$(jq -er --arg asset "$asset" '
              [.assets[] | select(.name == $asset) | .browser_download_url]
              | if length == 1 then .[0] else error("missing or duplicate release asset") end
            ' <<<"$RELEASE")
            curl --fail --silent --show-error --location --head \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$URL" >/dev/null
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Read package and AUR state
        id: state
        run: |
          set -euo pipefail
          CURRENT=$(sed -n 's/^pkgver=//p' docker-sbx-bin/PKGBUILD)
          RESULT_COUNT=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            'https://aur.archlinux.org/rpc/?v=5&type=info&arg=docker-sbx-bin' \
            | jq -er '.resultcount')
          [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          [[ "$RESULT_COUNT" =~ ^[0-9]+$ ]]
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "aur_exists=$([[ "$RESULT_COUNT" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          AUR_EXISTS: ${{ steps.state.outputs.aur_exists }}
          CURRENT_VERSION: ${{ steps.state.outputs.current }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" && \
                  ( -z "$MANUAL_VERSION" || "$ALLOW_DOWNGRADE" != "true" ) ]]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              echo "Set both version and allow_downgrade=true for an intentional downgrade." >&2
              exit 1
            fi
          fi

          NEEDS_UPDATE=false
          BUMP_REL=false
          INITIAL_PUBLISH=false
          if [[ "$AUR_EXISTS" != "true" ]]; then
            NEEDS_UPDATE=true
            INITIAL_PUBLISH=true
          elif [[ "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            NEEDS_UPDATE=true
          elif [[ "$FORCE_UPDATE" == "true" ]]; then
            NEEDS_UPDATE=true
            BUMP_REL=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"
          echo "initial_publish=$INITIAL_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Stage PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          CURRENT_VERSION: ${{ steps.state.outputs.current }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd docker-sbx-bin
          if [[ "$BUMP_REL" == "true" ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            [[ "$CURRENT_REL" =~ ^[0-9]+$ ]]
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [[ "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            sed -i "s/^pkgver=.*/pkgver=${LATEST_VERSION}/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: docker-sbx-bin
          pkgbuild: ./docker-sbx-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: |-
            Keep docker-sbx-bin aligned with upstream ${{ steps.release.outputs.version }}

            Constraint: Package official prebuilt amd64 and arm64 release archives
            Confidence: high
            Scope-risk: narrow
            Tested: updpkgsums and makepkg --printsrcinfo
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Record successful publication in GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          INITIAL_PUBLISH: ${{ steps.compare.outputs.initial_publish }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docker-sbx-bin/PKGBUILD; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-sbx-bin/PKGBUILD
          git commit -F - <<EOF
          Keep docker-sbx-bin aligned with upstream ${LATEST_VERSION}

          Constraint: AUR publication completed before recording GitHub state
          Confidence: high
          Scope-risk: narrow
          Tested: Release assets validated and AUR deploy completed
          EOF
          git push
