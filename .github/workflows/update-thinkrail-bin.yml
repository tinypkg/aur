name: Update thinkrail-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected upstream version (for example, 0.0.18)'
        required: false
        type: string
      force:
        description: 'Force verification and a packaging-only pkgrel bump'
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: 'Allow an explicitly requested older version'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */12 * * *'

concurrency:
  group: aur-thinkrail-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION=${INPUT_VERSION#v}
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
              echo "Unsupported requested version: $VERSION" >&2
              exit 1
            }
            API_URL="https://api.github.com/repos/JetBrains/thinkrail/releases/tags/v${VERSION}"
          else
            API_URL='https://api.github.com/repos/JetBrains/thinkrail/releases/latest'
          fi

          RELEASE_JSON=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$API_URL")
          TAG=$(jq -er '.tag_name | select(type == "string" and length > 1)' <<<"$RELEASE_JSON")
          VERSION=${TAG#v}
          [[ "$TAG" == "v${VERSION}" && "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream tag: $TAG" >&2
            exit 1
          }
          [[ $(jq -er '.draft' <<<"$RELEASE_JSON") == false ]] || {
            echo "Refusing draft release: $TAG" >&2
            exit 1
          }
          [[ -z "${INPUT_VERSION:-}" || "${INPUT_VERSION#v}" == "$VERSION" ]] || {
            echo "Requested version does not match release tag: $TAG" >&2
            exit 1
          }

          for asset in thinkrail-linux-x64 thinkrail-linux-arm64 SHA256SUMS; do
            count=$(jq -r --arg name "$asset" '[.assets[] | select(.name == $name)] | length' <<<"$RELEASE_JSON")
            [[ "$count" == 1 ]] || {
              echo "Expected exactly one $asset release asset, found $count" >&2
              exit 1
            }
            expected_url="https://github.com/JetBrains/thinkrail/releases/download/v${VERSION}/${asset}"
            actual_url=$(jq -er --arg name "$asset" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$RELEASE_JSON")
            [[ "$actual_url" == "$expected_url" ]] || {
              echo "Unexpected release asset URL for $asset" >&2
              exit 1
            }
            curl --fail --silent --show-error --location --head \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$expected_url" >/dev/null
          done

          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=thinkrail-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^pkgver=//p' thinkrail-bin/PKGBUILD)
          rel=$(sed -n 's/^pkgrel=//p' thinkrail-bin/PKGBUILD)
          [[ "$current" =~ ^[0-9]+([.][0-9]+)+$ && "$rel" =~ ^[0-9]+$ ]]

          if [[ "$LATEST_VERSION" != "$current" ]]; then
            oldest=$(printf '%s\n%s\n' "$current" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$oldest" != "$current" ]]; then
              [[ -n "${MANUAL_VERSION:-}" && "${ALLOW_DOWNGRADE:-false}" == true ]] || {
                echo "Refusing downgrade from $current to $LATEST_VERSION without explicit authorization" >&2
                exit 1
              }
            fi
            echo 'needs_update=true' >> "$GITHUB_OUTPUT"
            echo 'bump_rel=false' >> "$GITHUB_OUTPUT"
          elif [[ "$AUR_VERSION" != "$current-$rel" ]]; then
            echo 'needs_update=true' >> "$GITHUB_OUTPUT"
            echo 'bump_rel=false' >> "$GITHUB_OUTPUT"
            echo 'Publishing the current GitHub state to AUR'
          elif [[ "${FORCE_UPDATE:-false}" == true ]]; then
            echo 'needs_update=true' >> "$GITHUB_OUTPUT"
            echo 'bump_rel=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_update=false' >> "$GITHUB_OUTPUT"
            echo 'bump_rel=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stage PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd thinkrail-bin
          if [[ "$BUMP_REL" == true ]]; then
            rel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((rel + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: thinkrail-bin
          pkgbuild: ./thinkrail-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for thinkrail-bin {0}', steps.release.outputs.version) || format('Publish thinkrail-bin {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Record successful publication in GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- thinkrail-bin/PKGBUILD; then
            echo 'AUR publication required no GitHub metadata change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add thinkrail-bin/PKGBUILD
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for thinkrail-bin $LATEST_VERSION"
          else
            git commit -m "Update thinkrail-bin to version $LATEST_VERSION"
          fi
          git push
