name: Update agentero-desktop-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version. Leave empty to detect the latest GitHub release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-agentero-desktop-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
              echo "Unsupported upstream version: $VERSION" >&2
              exit 1
            }
            RELEASE_API="https://api.github.com/repos/poco-ai/Agentero/releases/tags/v${VERSION}"
          else
            RELEASE_API="https://api.github.com/repos/poco-ai/Agentero/releases/latest"
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${{ github.token }}" \
            "$RELEASE_API" --output release.json

          jq -e '(.draft == false) and (.prerelease == false)' release.json >/dev/null
          DISCOVERED_VERSION=$(jq -er '.tag_name | select(type == "string" and length > 0) | sub("^v"; "")' release.json)
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$VERSION" ]] || {
            echo "Release tag v$DISCOVERED_VERSION does not match requested version $VERSION" >&2
            exit 1
          }
          VERSION=$DISCOVERED_VERSION
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream version: $VERSION" >&2
            exit 1
          }

          # The release carries the Debian packages for the two Linux
          # architectures. The spelling of their names has changed between
          # releases, so they are taken from the release itself.
          DEB_AMD64=$(jq -r '[.assets[] | select(.name | test("(?i)^agentero_[0-9].*_amd64\\.deb$"))]
                          | if length == 1 then .[0].name else "" end' release.json)
          DEB_ARM64=$(jq -r '[.assets[] | select(.name | test("(?i)^agentero_[0-9].*_arm64\\.deb$"))]
                          | if length == 1 then .[0].name else "" end' release.json)
          [[ -n "$DEB_AMD64" ]] || {
            echo "Release v$VERSION has no single Debian package for amd64" >&2
            exit 1
          }
          [[ -n "$DEB_ARM64" ]] || {
            echo "Release v$VERSION has no single Debian package for arm64" >&2
            exit 1
          }
          for asset in "$DEB_AMD64" "$DEB_ARM64"; do
            jq -e --arg asset "$asset" \
              '.assets | any(.name == $asset and .state == "uploaded" and .size > 0)' \
              release.json >/dev/null || {
              echo "Release v$VERSION has no usable $asset" >&2
              exit 1
            }
          done

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' agentero-desktop-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' agentero-desktop-bin/PKGBUILD)
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=agentero-desktop-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "deb_amd64=$DEB_AMD64" >> "$GITHUB_OUTPUT"
          echo "deb_arm64=$DEB_ARM64" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$AUR_VERSION" ] && dpkg --compare-versions "$AUR_VERSION" gt "$LATEST_VERSION-$CURRENT_REL"; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | sed -n '1p')
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify deb payload
        if: steps.compare.outputs.package_update == 'true'
        env:
          DEB_AMD64: ${{ steps.release.outputs.deb_amd64 }}
          DEB_ARM64: ${{ steps.release.outputs.deb_arm64 }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          BASE="https://github.com/poco-ai/Agentero/releases/download/v${VERSION}"

          for name in "$DEB_AMD64" "$DEB_ARM64"; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1800 \
              "$BASE/$name" --output "$RUNNER_TEMP/$name"
          done

          # The release does not carry a checksum list, but GitHub knows the
          # digest of every file it serves.
          for pair in "$DEB_AMD64:amd64:X86-64" "$DEB_ARM64:arm64:AArch64"; do
            deb="${pair%%:*}"
            rest="${pair#*:}"
            architecture="${rest%%:*}"
            machine="${rest##*:}"

            digest=$(jq -r --arg n "$deb" '.assets[] | select(.name == $n) | .digest // ""' release.json)
            [[ "$digest" == sha256:* ]] || {
              echo "Release v$VERSION does not carry a digest for $deb" >&2
              exit 1
            }
            got=$(sha256sum "$RUNNER_TEMP/$deb" | cut -d' ' -f1)
            [ "$got" = "${digest#sha256:}" ] || {
              echo "Checksum mismatch for $deb" >&2
              exit 1
            }

            deb_package=$(dpkg-deb --field "$RUNNER_TEMP/$deb" Package)
            deb_version=$(dpkg-deb --field "$RUNNER_TEMP/$deb" Version)
            deb_arch=$(dpkg-deb --field "$RUNNER_TEMP/$deb" Architecture)
            [ "$deb_package" = "agentero" ] || {
              echo "$deb carries package $deb_package, expected agentero" >&2
              exit 1
            }
            [ "$deb_version" = "$VERSION" ] || {
              echo "$deb carries version $deb_version, expected $VERSION" >&2
              exit 1
            }
            [ "$deb_arch" = "$architecture" ] || {
              echo "$deb carries architecture $deb_arch, expected $architecture" >&2
              exit 1
            }

            # The listing is read in full first: piping into `grep -q` would
            # kill dpkg-deb with SIGPIPE, which pipefail reports as a failure.
            contents=$(dpkg-deb --contents "$RUNNER_TEMP/$deb")
            for path in usr/bin/agentero usr/lib/Agentero/cli/agentero-cli \
                        usr/lib/Agentero/pdfium/libpdfium.so \
                        usr/lib/Agentero/adapters/manifest.json \
                        usr/share/applications/Agentero.desktop \
                        usr/share/icons/hicolor/256x256@2/apps/agentero.png \
                        usr/share/icons/hicolor/32x32/apps/agentero.png; do
              grep -qE "(^| )(\\./)?${path}( -> .*)?$" <<<"$contents" || {
                echo "$deb does not install $path" >&2
                exit 1
              }
            done

            # Only the program and the command line program are unpacked: the
            # whole package is over two hundred megabytes.
            mkdir -p "$RUNNER_TEMP/payload/$architecture"
            dpkg-deb --fsys-tarfile "$RUNNER_TEMP/$deb" |
              tar -x -C "$RUNNER_TEMP/payload/$architecture" --wildcards \
                'usr/bin/agentero' 'usr/lib/Agentero/cli/agentero-cli'

            # LC_ALL=C keeps the header readable on any runner locale.
            for program in usr/bin/agentero usr/lib/Agentero/cli/agentero-cli; do
              header=$(LC_ALL=C readelf -h "$RUNNER_TEMP/payload/$architecture/$program")
              grep -q "Machine:.*${machine}" <<<"$header" || {
                echo "The program $program in $deb is not a $machine executable" >&2
                exit 1
              }
            done
          done

          # The licence of the program is taken from the repository.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "https://github.com/poco-ai/Agentero/raw/refs/tags/v${VERSION}/LICENSE" \
            --output "$RUNNER_TEMP/LICENSE"
          grep -q "MIT License" "$RUNNER_TEMP/LICENSE" || {
            echo "The licence of release v$VERSION is not the MIT licence" >&2
            exit 1
          }

      - name: Run the packaged program
        if: steps.compare.outputs.package_update == 'true'
        run: |
          set -euo pipefail

          # The command line program of the app needs little more than the C
          # library, so it can be started on a machine without a desktop.
          CLI="$RUNNER_TEMP/payload/amd64/usr/lib/Agentero/cli/agentero-cli"
          "$CLI" --help >"$RUNNER_TEMP/cli.out" 2>&1 || true
          if ! grep -q "Usage: agentero" "$RUNNER_TEMP/cli.out"; then
            echo "The packaged command line program does not start" >&2
            cat "$RUNNER_TEMP/cli.out" >&2
            exit 1
          fi

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          DEB_AMD64: ${{ steps.release.outputs.deb_amd64 }}
          DEB_ARM64: ${{ steps.release.outputs.deb_arm64 }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd agentero-desktop-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

          # The part of the file name in front of the version follows the
          # release; the version itself stays in the PKGBUILD. The underscore
          # behind it belongs to the file name, so it is kept.
          STEM="${DEB_AMD64%_amd64.deb}"
          PREFIX="${STEM%${LATEST_VERSION}}"
          if [ "${PREFIX}${LATEST_VERSION}_amd64.deb" != "$DEB_AMD64" ] ||
             [ "${PREFIX}${LATEST_VERSION}_arm64.deb" != "$DEB_ARM64" ]; then
            echo "The file names of the release do not share one prefix" >&2
            exit 1
          fi
          sed -i "s|^_deb_prefix=.*|_deb_prefix=\"$PREFIX\"|" PKGBUILD
          grep -qxF "_deb_prefix=\"$PREFIX\"" PKGBUILD || {
            echo "Failed to write _deb_prefix=$PREFIX" >&2
            exit 1
          }

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: agentero-desktop-bin
          pkgbuild: ./agentero-desktop-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for agentero-desktop-bin {0}', steps.release.outputs.version) || format('Update agentero-desktop-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add agentero-desktop-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for agentero-desktop-bin $VERSION"
          else
            git commit -m "Update agentero-desktop-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
