name: Update tldraw-offline-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.10.0). Leave empty to auto-detect latest version."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get latest version
        id: get_version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            LATEST_URL=$(curl --fail --silent --show-error --location --head \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              --output /dev/null --write-out '%{url_effective}' \
              https://github.com/tldraw/tldraw-offline/releases/latest)
            VERSION="${LATEST_URL##*/}"
            VERSION="${VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2}$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          assets=(
            tldraw-offline-linux-amd64.deb
            tldraw-offline-linux-arm64.AppImage
          )

          for asset in "${assets[@]}"; do
            curl --fail --silent --show-error --location --head \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://github.com/tldraw/tldraw-offline/releases/download/v${VERSION}/${asset}" \
              >/dev/null
          done

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' tldraw-offline-bin/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.current }}
          FORCE_UPDATE: ${{ inputs.force }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if [[ "$VERSION" == "$CURRENT_VERSION" ]]; then
            if [[ "$FORCE_UPDATE" == "true" ]]; then
              echo "needs_update=true" >> "$GITHUB_OUTPUT"
              echo "bump_rel=true" >> "$GITHUB_OUTPUT"
              echo "Forcing pkgrel bump for version $VERSION"
            else
              echo "needs_update=false" >> "$GITHUB_OUTPUT"
              echo "Version $VERSION is already up to date"
            fi
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "bump_rel=false" >> "$GITHUB_OUTPUT"
            echo "Updating from $CURRENT_VERSION to $VERSION"
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          cd tldraw-offline-bin
          if [[ "$BUMP_REL" == "true" ]]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            echo "Bumped pkgrel from $CURRENT_REL to $NEW_REL"
          else
            sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tldraw-offline-bin/PKGBUILD
          if [[ "$BUMP_REL" == "true" ]]; then
            git commit -m "Bump pkgrel for tldraw-offline-bin $VERSION"
          else
            git commit -m "Update tldraw-offline-bin to version $VERSION"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: tldraw-offline-bin
          pkgbuild: ./tldraw-offline-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.version) || format('Update to version {0}', steps.get_version.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
