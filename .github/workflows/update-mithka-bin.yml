name: Update mithka-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version, e.g. 1.12.8. Leave empty to detect the latest GitHub release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "20 */12 * * *"

concurrency:
  group: aur-mithka-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
              echo "Unsupported upstream version: $VERSION" >&2
              exit 1
            }
            RELEASE_API="https://api.github.com/repos/iebb/mithka/releases/tags/v${VERSION}"
          else
            RELEASE_API="https://api.github.com/repos/iebb/mithka/releases/latest"
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${{ github.token }}" \
            "$RELEASE_API" --output release.json

          jq -e '(.draft == false) and (.prerelease == false)' release.json >/dev/null
          DISCOVERED_VERSION=$(jq -er '.tag_name | select(type == "string" and length > 0) | sub("^v"; "")' release.json)
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$VERSION" ]] || {
            echo "Release tag v$DISCOVERED_VERSION does not match requested version $VERSION" >&2
            exit 1
          }
          VERSION=$DISCOVERED_VERSION
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream version: $VERSION" >&2
            exit 1
          }

          # Asset names embed a build date; verify via regex match and derive
          # the date from release-manifest.json.
          for arch in x64 arm64; do
            jq -e --arg v "$VERSION" --arg arch "$arch" \
              '.assets | any(
                 .name | test("^mithka-" + $v + "-[0-9]{8}-linux-" + $arch + "[.]tar[.]gz$")
               )' \
              release.json >/dev/null || {
              echo "Release v$VERSION has no usable mithka-${VERSION}-*linux-${arch}.tar.gz" >&2
              exit 1
            }
          done

          TAGDATE=$(jq -er --arg v "$VERSION" \
            '[.assets[].name
                | select(test("^mithka-" + $v + "-[0-9]{8}-linux-x64.tar.gz$"))
                | capture("^mithka-" + $v + "-(?<d>[0-9]{8})-linux-x64.tar.gz$").d][0]' \
            release.json)
          [[ "$TAGDATE" =~ ^[0-9]{8}$ ]] || {
            echo "Could not derive the asset build date for $VERSION" >&2
            exit 1
          }

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' mithka-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' mithka-bin/PKGBUILD)
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=mithka-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tagdate=$TAGDATE" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$AUR_VERSION" ] && dpkg --compare-versions "$AUR_VERSION" gt "$LATEST_VERSION-$CURRENT_REL"; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify tarball payloads
        if: steps.compare.outputs.package_update == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAGDATE: ${{ steps.release.outputs.tagdate }}
        run: |
          set -euo pipefail

          BASE="https://github.com/iebb/mithka/releases/download/v${VERSION}"
          # GitHub's release download endpoint intermittently answers 500 to
          # runner IPs; retry a few times with a backoff before giving up.
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 120 \
              "$BASE/release-manifest.json" --output "$RUNNER_TEMP/release-manifest.json"; then
              break
            fi
            [[ "$attempt" == 5 ]] && {
              echo "release-manifest.json stayed unreachable after $attempt attempts" >&2
              exit 1
            }
            sleep $((attempt * 5))
          done
          [[ "$(jq -er '.version' "$RUNNER_TEMP/release-manifest.json")" == "$VERSION" ]] || {
            echo "manifest version does not match release $VERSION" >&2
            exit 1
          }

          # Check the payloads by manifest hash and ELF machine type. Do not
          # execute the app here: it links against GUI libraries the runner
          # does not ship.
          while IFS=: read -r arch asset machine; do
            sum=$(jq -er --arg asset "$asset" '.files[$asset].sha256' "$RUNNER_TEMP/release-manifest.json")
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location \
                --connect-timeout 15 --max-time 1200 \
                "$BASE/$asset" --output "$RUNNER_TEMP/$asset"; then
                break
              fi
              [[ "$attempt" == 5 ]] && {
                echo "$asset stayed unreachable after $attempt attempts" >&2
                exit 1
              }
              sleep $((attempt * 5))
            done
            printf '%s  %s\n' "$sum" "$RUNNER_TEMP/$asset" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
            readelf -h "$RUNNER_TEMP/Mithka/mithka" | grep -F "$machine" >/dev/null
            test -f "$RUNNER_TEMP/Mithka/lib/libtdjson.so"
            test -f "$RUNNER_TEMP/Mithka/data/flutter_assets/version.json"
            flutter_version=$(jq -r '.version' "$RUNNER_TEMP/Mithka/data/flutter_assets/version.json")
            [[ "$flutter_version" == "$VERSION" ]] || {
              echo "flutter_assets version $flutter_version does not match $VERSION" >&2
              exit 1
            }
            echo "verified $asset"
          done <<EOF
          x86_64:mithka-${VERSION}-${TAGDATE}-linux-x64.tar.gz:Advanced Micro Devices X86-64
          aarch64:mithka-${VERSION}-${TAGDATE}-linux-arm64.tar.gz:AArch64
          EOF

          for url in \
            "https://raw.githubusercontent.com/iebb/mithka/v${VERSION}/LICENSE" \
            "https://raw.githubusercontent.com/iebb/mithka/v${VERSION}/assets/app_icon.png"; do
            # A 404 must fail; transient CDN 5xx only warn, updpkgsums will
            # fail loudly anyway if the files are really gone.
            code=$(curl --silent --show-error --location --head \
              --connect-timeout 15 --max-time 120 \
              -o /dev/null -w '%{http_code}' "$url") || code=000
            if [[ "$code" == 404 ]]; then
              echo "raw file is gone (404): $url" >&2
              exit 1
            fi
            [[ "$code" =~ ^2 ]] || echo "warn: $url answered $code; continuing" >&2
          done

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          LATEST_TAGDATE: ${{ steps.release.outputs.tagdate }}
        run: |
          set -euo pipefail
          cd mithka-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i "s/^_tagdate=.*/_tagdate=$LATEST_TAGDATE/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: mithka-bin
          pkgbuild: ./mithka-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for mithka-bin {0}', steps.release.outputs.version) || format('Update mithka-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mithka-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for mithka-bin $VERSION"
          else
            git commit -m "Update mithka-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
