name: Update dim-agent-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Expected upstream desktop version (for example, 0.9.13)'
        required: false
        type: string
      force:
        description: 'Force verification and a packaging-only pkgrel bump'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */12 * * *'

concurrency:
  group: aur-dim-agent-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          API_URL='https://dimagent.cn/web-api/releases'
          API_JSON=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 "$API_URL")
          VERSION=$(jq -er '.desktop.linux.x64 | select(type == "string" and length > 0)' <<<"$API_JSON")
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream version: $VERSION" >&2
            exit 1
          }
          [[ -z "${INPUT_VERSION:-}" || "${INPUT_VERSION#v}" == "$VERSION" ]] || {
            echo "Requested version ${INPUT_VERSION#v} does not match API version $VERSION" >&2
            exit 1
          }

          DOWNLOAD_URL="https://dimcode.echooai.com/updates/stable/linux/x64/DimAgent-${VERSION}.deb"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 1200 \
            "$DOWNLOAD_URL" --output dimagent.deb

          PACKAGE=$(dpkg-deb --field dimagent.deb Package)
          ARCHITECTURE=$(dpkg-deb --field dimagent.deb Architecture)
          CONTROL_VERSION=$(dpkg-deb --field dimagent.deb Version)
          [[ "$PACKAGE" == dimagent ]] || { echo "Unexpected package: $PACKAGE" >&2; exit 1; }
          [[ "$ARCHITECTURE" == amd64 ]] || { echo "Unexpected architecture: $ARCHITECTURE" >&2; exit 1; }
          [[ "$CONTROL_VERSION" == "$VERSION"-* ]] || {
            echo "Debian version $CONTROL_VERSION does not match API version $VERSION" >&2
            exit 1
          }
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=dim-agent-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: compare
        env:
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          FORCE_UPDATE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^pkgver=//p' dim-agent-bin/PKGBUILD)
          rel=$(sed -n 's/^pkgrel=//p' dim-agent-bin/PKGBUILD)
          [[ "$current" =~ ^[0-9]+([.][0-9]+)+$ && "$rel" =~ ^[0-9]+$ ]]
          if [[ "$LATEST_VERSION" != "$current" ]]; then
            oldest=$(printf '%s\n%s\n' "$current" "$LATEST_VERSION" | sort -V | head -n1)
            [[ "$oldest" == "$current" ]] || { echo "Refusing automatic downgrade" >&2; exit 1; }
            echo 'needs_update=true' >> "$GITHUB_OUTPUT"
            echo 'bump_rel=false' >> "$GITHUB_OUTPUT"
          elif [[ "$AUR_VERSION" != "$current-$rel" ]]; then
            echo 'needs_update=true' >> "$GITHUB_OUTPUT"
            echo 'bump_rel=false' >> "$GITHUB_OUTPUT"
            echo 'Publishing the current GitHub state to AUR'
          elif [[ "${FORCE_UPDATE:-false}" == true ]]; then
            echo 'needs_update=true' >> "$GITHUB_OUTPUT"
            echo 'bump_rel=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_update=false' >> "$GITHUB_OUTPUT"
            echo 'bump_rel=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Stage PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
        run: |
          set -euo pipefail
          cd dim-agent-bin
          if [[ "$BUMP_REL" == true ]]; then
            rel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((rel + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: dim-agent-bin
          pkgbuild: ./dim-agent-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for dim-agent-bin {0}', steps.release.outputs.version) || format('Update dim-agent-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Record successful publication in GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
        run: |
          set -euo pipefail
          if git diff --quiet -- dim-agent-bin/PKGBUILD; then
            echo 'AUR publication required no GitHub metadata change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add dim-agent-bin/PKGBUILD
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for dim-agent-bin $LATEST_VERSION"
          else
            git commit -m "Update dim-agent-bin to version $LATEST_VERSION"
          fi
          git push
