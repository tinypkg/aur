name: Update better-vault-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.7.0). Leave empty to detect the latest release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "49 */12 * * *"

concurrency:
  group: aur-better-vault-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          REQ="${INPUT_VERSION:-}"
          REQ="${REQ#v}"

          if [ -n "$REQ" ]; then
            [[ "$REQ" =~ ^[0-9]+([.][0-9]+)+$ ]] || fail "Unsupported version: $REQ"
            VERSION="$REQ"
          else
            release=$(curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/better-vault/better-vault/releases/latest") ||
              fail "Could not read the latest release from GitHub"
            VERSION=$(jq -er '.tag_name | strings | select(length > 0)' <<< "$release") ||
              fail "Latest release has no tag name"
            VERSION="${VERSION#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || fail "Unsupported version: $VERSION"

          release=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/better-vault/better-vault/releases/tags/v$VERSION") ||
            fail "Release v$VERSION does not exist"
          jq -e '.prerelease == false' <<< "$release" > /dev/null ||
            fail "Release v$VERSION is a prerelease"
          jq -e --arg t "v$VERSION" '.tag_name == $t' <<< "$release" > /dev/null ||
            fail "GitHub returned an unexpected tag for v$VERSION"

          # No checksum sidecar is published for the .debs: the electron-updater
          # manifests (latest-linux*.yml) have drifted from the uploaded assets
          # before, so they cannot be trusted. Integrity instead comes from the
          # dpkg-deb metadata and payload checks below, plus updpkgsums at
          # publish time.
          BASE="https://github.com/better-vault/better-vault/releases/download/v$VERSION"
          for arch in amd64 arm64; do
            name="better-vault-$VERSION-linux-$arch.deb"
            jq -e --arg n "$name" 'any(.assets[]; .name == $n and .size > 0)' <<< "$release" > /dev/null ||
              fail "Release v$VERSION has no $name asset"

            out="$RUNNER_TEMP/$name"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1800 \
              "$BASE/$name" --output "$out"

            deb_version=$(dpkg-deb --field "$out" Version)
            deb_arch=$(dpkg-deb --field "$out" Architecture)
            [ "$deb_version" = "$VERSION" ] ||
              fail "$name carries Version $deb_version, expected $VERSION"
            [ "$deb_arch" = "$arch" ] ||
              fail "$name carries Architecture $deb_arch, expected $arch"

            dpkg-deb --contents "$out" > "$RUNNER_TEMP/contents-$arch.txt"
            for path in 'opt/better-vault/better-vault-desktop$' \
                        'opt/better-vault/chrome-sandbox$' \
                        'opt/better-vault/resources/app\.asar$' \
                        'usr/share/applications/better-vault-desktop\.desktop$' \
                        'usr/share/icons/.*/apps/better-vault-desktop.*\.(png|svg)$'; do
              grep -q "$path" "$RUNNER_TEMP/contents-$arch.txt" || {
                echo "$name is missing an expected payload path ($path); listing follows:" >&2
                cat "$RUNNER_TEMP/contents-$arch.txt" >&2
                exit 1
              }
            done
            echo "verified $name ($deb_version, $deb_arch)"
          done

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' better-vault-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' better-vault-bin/PKGBUILD)

          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=better-vault-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [ -n "$AUR_VERSION" ] && [ "$AUR_VERSION" != "$AHEAD_REF" ] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | head -n1)" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd better-vault-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: better-vault-bin
          pkgbuild: ./better-vault-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for better-vault-bin {0}', steps.release.outputs.version) || format('Update better-vault-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add better-vault-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for better-vault-bin $VERSION"
          else
            git commit -m "Update better-vault-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
