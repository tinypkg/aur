name: Update llmux-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.2.17). Leave empty to auto-detect latest version."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get latest version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            VERSION="${VERSION#v}"
          else
            VERSION=$(curl -fsSL https://api.github.com/repos/2lab-ai/llmux/releases/latest | jq -er '.tag_name | sub("^v"; "")')
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported version format: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' llmux-bin/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          LATEST_VERSION: ${{ steps.get_version.outputs.version }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.current }}
          FORCE_UPDATE: ${{ github.event.inputs.force }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -z "$MANUAL_VERSION" ] && [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing automatic downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
          fi
          if [ "$LATEST_VERSION" = "$CURRENT_VERSION" ]; then
            if [ "$FORCE_UPDATE" = "true" ]; then
              echo "needs_update=true" >> "$GITHUB_OUTPUT"
              echo "bump_rel=true" >> "$GITHUB_OUTPUT"
              echo "Forcing pkgrel bump for version $LATEST_VERSION"
            else
              echo "needs_update=false" >> "$GITHUB_OUTPUT"
              echo "Version $LATEST_VERSION is already up to date"
            fi
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "bump_rel=false" >> "$GITHUB_OUTPUT"
            echo "Updating from $CURRENT_VERSION to $LATEST_VERSION"
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.get_version.outputs.version }}
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
        run: |
          cd llmux-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            echo "Bumped pkgrel from $CURRENT_REL to $NEW_REL"
          else
            sed -i "s/^pkgver=.*/pkgver=${LATEST_VERSION}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.get_version.outputs.version }}
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add llmux-bin/PKGBUILD
          if [ "$BUMP_REL" = "true" ]; then
            git commit \
              -m "Republish llmux-bin metadata for version $LATEST_VERSION" \
              -m "The upstream version is unchanged, so this automated release increments pkgrel for a packaging-only correction." \
              -m $'Constraint: Upstream release assets remain unchanged\nConfidence: high\nScope-risk: narrow\nNot-tested: AUR deployment runs in the following workflow step'
          else
            git commit \
              -m "Keep llmux-bin aligned with upstream release $LATEST_VERSION" \
              -m "The release monitor detected a newer upstream tag and reset pkgrel for the new package version." \
              -m $'Constraint: Package sources track GitHub release assets\nConfidence: high\nScope-risk: narrow\nNot-tested: AUR deployment runs in the following workflow step'
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: llmux-bin
          pkgbuild: ./llmux-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: |-
            ${{ steps.compare.outputs.bump_rel == 'true' && format('Republish llmux-bin metadata for version {0}', steps.get_version.outputs.version) || format('Keep llmux-bin aligned with upstream release {0}', steps.get_version.outputs.version) }}

            GitHub Actions refreshed checksums and package metadata from the upstream release assets.

            Constraint: Package sources track GitHub release assets
            Confidence: high
            Scope-risk: narrow
            Tested: updpkgsums and .SRCINFO generation in the deployment action
          ssh_keyscan_types: rsa,ecdsa,ed25519
