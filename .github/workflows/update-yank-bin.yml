name: Update yank-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version. Leave empty to detect the newest usable release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-yank-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKGDIR=yank-bin

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
              echo "Unsupported version: $VERSION" >&2
              exit 1
            }
            RELEASE_API="https://api.github.com/repos/ca-x/yank/releases/tags/v${VERSION}"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$RELEASE_API" --output release.json
            jq -e --arg v "$VERSION" '
              ([.assets[].name] | (index("yank_\($v)_amd64.deb") != null and
                                  index("yank_\($v)_arm64.deb") != null))' \
              release.json >/dev/null || {
              echo "Release v${VERSION} is missing a Linux .deb" >&2
              exit 1
            }
          else
            # Releases also carry macOS, Windows and Android builds, so require
            # both Linux .debs rather than trusting whatever is newest.
            RELEASE_API="https://api.github.com/repos/ca-x/yank/releases?per_page=30"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$RELEASE_API" --output release.json
            VERSION=$(jq -r '
              [ .[]
                | select(.draft == false and .prerelease == false)
                | select(.tag_name | test("^v[0-9]+(\\.[0-9]+)+$"))
                | . as $r
                | ($r.tag_name | sub("^v"; "")) as $v
                | select([$r.assets[].name]
                         | (index("yank_\($v)_amd64.deb") != null and
                            index("yank_\($v)_arm64.deb") != null))
                | $v
              ] | .[]' release.json | sort -V | tail -n1)
            [[ -n "$VERSION" ]] || {
              echo "No release carries both Linux .debs" >&2
              exit 1
            }
          fi
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream version: $VERSION" >&2
            exit 1
          }

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' "$PKGDIR/PKGBUILD")
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' "$PKGDIR/PKGBUILD")
          RESULT_COUNT=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            'https://aur.archlinux.org/rpc/?v=5&type=info&arg=yank-bin' |
            jq -er '.resultcount')
          [[ "$RESULT_COUNT" =~ ^[0-9]+$ ]] || {
            echo "Unexpected AUR RPC response" >&2
            exit 1
          }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_exists=$([[ "$RESULT_COUNT" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_EXISTS: ${{ steps.release.outputs.aur_exists }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [[ "$AUR_EXISTS" != "true" ]]; then
            PACKAGE_UPDATE=true
          elif [[ "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            PACKAGE_UPDATE=true
          elif [[ "${FORCE_UPDATE:-false}" == true ]]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Validate Debian payloads
        if: steps.compare.outputs.package_update == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          BASE="https://github.com/ca-x/yank/releases/download/v${VERSION}"

          validate() {  # <debian arch> <checksum-file suffix>
            local dpkg_arch="$1" sums_suffix="$2"
            local asset="yank_${VERSION}_${dpkg_arch}.deb"
            local sums="SHA256SUMS-linux-${sums_suffix}.txt"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
              "${BASE}/${asset}" --output "$RUNNER_TEMP/$asset"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              "${BASE}/${sums}" --output "$RUNNER_TEMP/$sums"
            local expected actual
            expected=$(awk -v a="$asset" '$2 == a { print $1 }' "$RUNNER_TEMP/$sums")
            actual=$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)
            [[ -n "$expected" && "$expected" == "$actual" ]] || {
              echo "Checksum mismatch for $asset" >&2
              exit 1
            }
            [[ $(dpkg-deb --field "$RUNNER_TEMP/$asset" Package) == yank ]]
            [[ $(dpkg-deb --field "$RUNNER_TEMP/$asset" Version) == "$VERSION" ]]
            [[ $(dpkg-deb --field "$RUNNER_TEMP/$asset" Architecture) == "$dpkg_arch" ]]
            # Keep the listing in a file: letting grep exit early closes the
            # pipe under pipefail and trips tar with a bogus write error. The
            # leading "./" depends on the tool that built the .deb.
            dpkg-deb --fsys-tarfile "$RUNNER_TEMP/$asset" |
              tar -tf - | sed 's|^\./||' > "$RUNNER_TEMP/listing.txt"
            for entry in \
              usr/bin/yank-client \
              usr/bin/yank-server \
              usr/share/applications/io.github.cax.yank.desktop; do
              grep -qx "$entry" "$RUNNER_TEMP/listing.txt" || {
                echo "Unexpected archive layout in $asset: missing $entry" >&2
                exit 1
              }
            done
          }

          # Upstream names the checksum files after the Rust target triple
          # (linux-x86_64 / linux-arm64) but the .debs after the Debian
          # architecture (amd64 / arm64).
          validate amd64 x86_64
          validate arm64 arm64

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd yank-bin
          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [[ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: yank-bin
          pkgbuild: ./yank-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for yank-bin {0}', steps.release.outputs.version) || format('Update yank-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yank-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo 'AUR publication required no GitHub metadata change.'
            exit 0
          fi
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for yank-bin $VERSION"
          else
            git commit -m "Update yank-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
