name: Update ediary-bin Version

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Debian package tag from the download filename (e.g., 1.0~beta2-2)"
        required: true
        type: string

concurrency:
  group: aur-ediary-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate package tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG=${INPUT_TAG#v}
          if [[ ! "$TAG" =~ ^[0-9]+([.][0-9]+)*(~[0-9A-Za-z.]+)?-[1-9][0-9]*$ ]]; then
            echo "Unsupported Debian package tag: $INPUT_TAG" >&2
            exit 1
          fi

          UPSTREAM_VERSION=${TAG%-*}
          PKGVER=${UPSTREAM_VERSION//~/.}
          PKGREL=${TAG##*-}
          EXPECTED_DESKTOP_VERSION=${UPSTREAM_VERSION//~/-}
          DOWNLOAD_URL="https://down.haoxg.net/download/ediary/linux/ediary_${TAG}_amd64.deb"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 1200 \
            --output ediary.deb "$DOWNLOAD_URL"

          PACKAGE_NAME=$(dpkg-deb --field ediary.deb Package)
          PACKAGE_ARCH=$(dpkg-deb --field ediary.deb Architecture)
          CONTROL_VERSION=$(dpkg-deb --field ediary.deb Version)
          [[ "$PACKAGE_NAME" == ediary ]] || {
            echo "Expected package ediary, found $PACKAGE_NAME" >&2
            exit 1
          }
          [[ "$PACKAGE_ARCH" == amd64 ]] || {
            echo "Expected architecture amd64, found $PACKAGE_ARCH" >&2
            exit 1
          }

          mkdir extracted
          dpkg-deb --extract ediary.deb extracted
          DESKTOP_VERSION=$(sed -n 's/^Version=//p' extracted/usr/share/applications/ediary.desktop)
          [[ "$DESKTOP_VERSION" == "$EXPECTED_DESKTOP_VERSION" ]] || {
            echo "Desktop version $DESKTOP_VERSION does not match tag $TAG" >&2
            exit 1
          }
          if [[ "$CONTROL_VERSION" != "$EXPECTED_DESKTOP_VERSION" ]]; then
            echo "::warning::Upstream deb control version is stale ($CONTROL_VERSION); validated desktop version $DESKTOP_VERSION instead."
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$PKGREL" >> "$GITHUB_OUTPUT"

      - name: Read package and AUR state
        id: state
        run: |
          set -euo pipefail

          CURRENT_TAG=$(sed -n "s/^_debver='\([^']*\)'/\1/p" ediary-bin/PKGBUILD)
          RESULT_COUNT=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=ediary-bin' |
              jq -er '.resultcount'
          )
          [[ "$CURRENT_TAG" =~ ^[0-9]+([.][0-9]+)*(~[0-9A-Za-z.]+)?-[1-9][0-9]*$ ]]
          [[ "$RESULT_COUNT" =~ ^[0-9]+$ ]]

          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "aur_exists=$([[ "$RESULT_COUNT" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_EXISTS: ${{ steps.state.outputs.aur_exists }}
          CURRENT_TAG: ${{ steps.state.outputs.current_tag }}
          REQUESTED_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if dpkg --compare-versions "$REQUESTED_TAG" lt "$CURRENT_TAG"; then
            echo "Refusing downgrade from $CURRENT_TAG to $REQUESTED_TAG" >&2
            exit 1
          fi

          NEEDS_UPDATE=false
          if [[ "$AUR_EXISTS" != true || "$REQUESTED_TAG" != "$CURRENT_TAG" ]]; then
            NEEDS_UPDATE=true
          fi
          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"

      - name: Stage PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          PKGREL: ${{ steps.release.outputs.pkgrel }}
          PKGVER: ${{ steps.release.outputs.pkgver }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cd ediary-bin
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${PKGREL}/" PKGBUILD
          sed -i "s/^_debver=.*/_debver='${TAG}'/" PKGBUILD

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ediary-bin
          pkgbuild: ./ediary-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: |-
            Keep ediary-bin aligned with upstream ${{ steps.release.outputs.tag }}

            Constraint: Upstream exposes no machine-readable latest-version endpoint
            Constraint: The deb control version is stale, so the desktop metadata is validated
            Confidence: high
            Scope-risk: narrow
            Tested: Download, package identity, architecture, desktop version, updpkgsums, and makepkg --printsrcinfo
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Record successful publication in GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- ediary-bin/PKGBUILD; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ediary-bin/PKGBUILD
          git commit -F - <<EOF
          Keep ediary-bin aligned with upstream ${TAG}

          Constraint: AUR publication completed before recording GitHub state
          Confidence: high
          Scope-risk: narrow
          Tested: Release package validated and AUR deploy completed
          EOF
          git push
