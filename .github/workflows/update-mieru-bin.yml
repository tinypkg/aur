name: Update mieru-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 3.40.0). Leave empty to use the latest stable GitHub release."
        required: false
        type: string
      force:
        description: "Force a packaging-only pkgrel bump"
        required: false
        default: false
      allow_downgrade:
        description: "Allow an explicitly requested version downgrade"
        required: false
        default: false
  schedule:
    - cron: "23 */12 * * *"

concurrency:
  group: aur-mieru-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
            API_URL="https://api.github.com/repos/enfein/mieru/releases/tags/v${VERSION}"
          else
            API_URL='https://api.github.com/repos/enfein/mieru/releases/latest'
          fi

          release=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$API_URL") || fail "Could not read the release from GitHub"

          TAG=$(jq -er '.tag_name | strings | select(length > 1)' <<<"$release") ||
            fail "Release has no tag name"
          VERSION="${TAG#v}"
          [[ "$TAG" == "v${VERSION}" && "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] ||
            fail "Unsupported release tag: $TAG"
          jq -e '.draft == false and .prerelease == false' <<<"$release" >/dev/null ||
            fail "Release $TAG is a draft or a prerelease"

          # The Debian packages are the payload of this package. The release
          # also carries .rpm, .tar.gz and .zip builds for other systems, and
          # a release without the .debs has to fail loudly rather than
          # publish something else.
          for arch in amd64 arm64; do
            for asset in "mieru_${VERSION}_${arch}.deb" "mieru_${VERSION}_${arch}.deb.sha256.txt"; do
              jq -e --arg n "$asset" \
                '.assets | any(.name == $n and .state == "uploaded" and .size > 0)' \
                <<<"$release" >/dev/null ||
                fail "Release $TAG does not carry $asset"
            done
          done

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare release with PKGBUILD
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' mieru-bin/PKGBUILD)
          [[ -n "$CURRENT_VERSION" ]] || { echo 'PKGBUILD has no pkgver' >&2; exit 1; }
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' mieru-bin/PKGBUILD)
          [[ -n "$CURRENT_REL" ]] || { echo 'PKGBUILD has no pkgrel' >&2; exit 1; }

          # Compare against what AUR actually serves: a run whose publication
          # failed after the GitHub copy moved on must be retried, not skipped
          # as "already up to date".
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=mieru-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )
          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [[ -n "$AUR_VERSION" && "$AUR_VERSION" != "$AHEAD_REF" ]] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | head -n1)" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          NEEDS_UPDATE=false
          BUMP_REL=false
          if [[ "$LATEST_VERSION" == "$CURRENT_VERSION" ]]; then
            if [[ "$FORCE_UPDATE" == true ]]; then
              NEEDS_UPDATE=true
              BUMP_REL=true
            elif [[ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]]; then
              # Also the first publication, when AUR has no such package yet.
              NEEDS_UPDATE=true
              echo "Publishing the existing package state to AUR"
            fi
          else
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]]; then
              [[ -n "$REQUESTED_VERSION" && "$ALLOW_DOWNGRADE" == true ]] || {
                echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
                exit 1
              }
            fi
            NEEDS_UPDATE=true
          fi

          echo "needs_update=$NEEDS_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify the release payload
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          BASE="https://github.com/enfein/mieru/releases/download/v${LATEST_VERSION}"
          mkdir -p "$RUNNER_TEMP/payload"

          for arch in amd64 arm64; do
            deb="mieru_${LATEST_VERSION}_${arch}.deb"
            sums="${deb}.sha256.txt"

            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 600 \
              "$BASE/$deb" --output "$RUNNER_TEMP/payload/$deb"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$BASE/$sums" --output "$RUNNER_TEMP/payload/$sums"

            # The release carries the checksum of every file next to it.
            (cd "$RUNNER_TEMP/payload" && sha256sum --check --strict "$sums") ||
              fail "The checksum of $deb does not match the one of the release"

            deb_version=$(dpkg-deb --field "$RUNNER_TEMP/payload/$deb" Version)
            deb_arch=$(dpkg-deb --field "$RUNNER_TEMP/payload/$deb" Architecture)
            [ "$deb_version" = "$LATEST_VERSION" ] ||
              fail "$deb carries Version $deb_version, expected $LATEST_VERSION"
            [ "$deb_arch" = "$arch" ] ||
              fail "$deb carries Architecture $deb_arch, expected $arch"

            # Read the listing in full first: piping into `grep -q` would kill
            # dpkg-deb with SIGPIPE, which pipefail then reports as a failure.
            contents=$(dpkg-deb --contents "$RUNNER_TEMP/payload/$deb")
            grep -qE '\./usr/bin/mieru$' <<<"$contents" ||
              fail "$deb does not install usr/bin/mieru"

            # The program must be built for the architecture of its package.
            rm -rf "$RUNNER_TEMP/unpack"
            mkdir -p "$RUNNER_TEMP/unpack"
            data_archive=$(bsdtar -tf "$RUNNER_TEMP/payload/$deb" | sed -n '/^data\.tar\./{p;q;}')
            [ -n "$data_archive" ] || fail "$deb holds no data.tar.*"
            bsdtar -xOf "$RUNNER_TEMP/payload/$deb" "$data_archive" |
              bsdtar --no-same-owner -xf - -C "$RUNNER_TEMP/unpack"

            header=$(LC_ALL=C readelf -h "$RUNNER_TEMP/unpack/usr/bin/mieru")
            case "$arch" in
              amd64) machine='X86-64' ;;
              arm64) machine='AArch64' ;;
            esac
            grep -q "Machine:.*${machine}" <<<"$header" ||
              fail "The program of $deb is not a ${machine} executable"

            echo "verified $deb ($deb_version, $deb_arch, $machine)"
          done

          # The Debian package carries no copyright file, so the licence comes
          # from the repository of the release.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            "https://github.com/enfein/mieru/raw/refs/tags/v${LATEST_VERSION}/LICENSE" \
            --output "$RUNNER_TEMP/payload/LICENSE"
          grep -q "GNU GENERAL PUBLIC LICENSE" "$RUNNER_TEMP/payload/LICENSE" ||
            fail "The licence of release v${LATEST_VERSION} is not the GNU General Public License"
          grep -q "Version 3" "$RUNNER_TEMP/payload/LICENSE" ||
            fail "The licence of release v${LATEST_VERSION} is not version 3 of the GNU General Public License"

      - name: Run the packaged program
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          # The runner is an x86_64 machine, so that is the package to try.
          deb="mieru_${LATEST_VERSION}_amd64.deb"
          rm -rf "$RUNNER_TEMP/run"
          mkdir -p "$RUNNER_TEMP/run"
          data_archive=$(bsdtar -tf "$RUNNER_TEMP/payload/$deb" | sed -n '/^data\.tar\./{p;q;}')
          bsdtar -xOf "$RUNNER_TEMP/payload/$deb" "$data_archive" |
            bsdtar --no-same-owner -xf - -C "$RUNNER_TEMP/run"
          program="$RUNNER_TEMP/run/usr/bin/mieru"

          # The program is a static build: it must run without any library
          # of the system. A static program has no interpreter and asks for
          # no shared library.
          if readelf -l "$program" | grep -q "INTERP"; then
            fail "The program of $deb is linked against shared libraries"
          fi
          if readelf -d "$program" 2>/dev/null | grep -q "NEEDED"; then
            fail "The program of $deb needs shared libraries"
          fi

          version=$("$program" version) || fail "The program of $deb does not run"
          [ "$version" = "$LATEST_VERSION" ] ||
            fail "The program of $deb reports version $version, expected $LATEST_VERSION"

          # The list of the commands is read in full first: piping into
          # `grep -q` would kill the program with SIGPIPE, which pipefail
          # reports as a failure.
          commands=$("$program" help) || fail "The program of $deb does not print its help"
          grep -q "^  start" <<<"$commands" ||
            fail "The program of $deb does not list its commands"
          grep -q "^  apply config" <<<"$commands" ||
            fail "The program of $deb does not list its commands"

          echo "the program of $deb runs and reports version $version"

      - name: Update PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd mieru-bin

          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            [[ "$CURRENT_REL" =~ ^[0-9]+$ ]] || { echo "Invalid pkgrel: $CURRENT_REL" >&2; exit 1; }
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: mieru-bin
          pkgbuild: ./mieru-bin/PKGBUILD
          assets: ./mieru-bin/mieru-bin.install
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.release.outputs.version) || format('Update to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit successfully published version to GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add mieru-bin/PKGBUILD
          # Publishing the state GitHub already has changes nothing here.
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for mieru-bin $LATEST_VERSION"
          else
            git commit -m "Update mieru-bin to version $LATEST_VERSION"
          fi
          git pull --rebase origin main
          git push
