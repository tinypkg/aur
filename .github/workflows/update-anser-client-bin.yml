name: Update anser-client-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version. Leave empty to detect the latest GitHub release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-anser-client-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
              echo "Unsupported upstream version: $VERSION" >&2
              exit 1
            }
            RELEASE_API="https://api.github.com/repos/ca-x/anser/releases/tags/v${VERSION}"
          else
            RELEASE_API="https://api.github.com/repos/ca-x/anser/releases/latest"
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${{ github.token }}" \
            "$RELEASE_API" --output release.json

          jq -e '(.draft == false) and (.prerelease == false)' release.json >/dev/null
          DISCOVERED_VERSION=$(jq -er '.tag_name | select(type == "string" and length > 0) | sub("^v"; "")' release.json)
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$VERSION" ]] || {
            echo "Release tag v$DISCOVERED_VERSION does not match requested version $VERSION" >&2
            exit 1
          }
          VERSION=$DISCOVERED_VERSION
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream version: $VERSION" >&2
            exit 1
          }

          # The release carries the client for Linux and the checksums of the
          # release. The file name of the client has no version in it.
          TARBALL=$(jq -r '[.assets[] | select(.name == "anser-client-linux-x86_64.tar.gz")]
                       | if length == 1 then .[0].name else "" end' release.json)
          [[ -n "$TARBALL" ]] || {
            echo "Release v$VERSION has no single client for Linux on x86_64" >&2
            exit 1
          }
          for asset in "$TARBALL" SHA256SUMS; do
            jq -e --arg asset "$asset" \
              '.assets | any(.name == $asset and .state == "uploaded" and .size > 0)' \
              release.json >/dev/null || {
              echo "Release v$VERSION has no usable $asset" >&2
              exit 1
            }
          done

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' anser-client-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' anser-client-bin/PKGBUILD)
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=anser-client-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$AUR_VERSION" ] && dpkg --compare-versions "$AUR_VERSION" gt "$LATEST_VERSION-$CURRENT_REL"; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | sed -n '1p')
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify the release payload
        if: steps.compare.outputs.package_update == 'true'
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          BASE="https://github.com/ca-x/anser/releases/download/v${VERSION}"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1200 \
            "$BASE/$TARBALL" --output "$RUNNER_TEMP/$TARBALL"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "$BASE/SHA256SUMS" --output "$RUNNER_TEMP/SHA256SUMS"

          (cd "$RUNNER_TEMP" && grep " ${TARBALL}\$" SHA256SUMS | sha256sum --check)

          # The list of files is read in full first: piping into `grep -q`
          # would kill tar with SIGPIPE, which pipefail reports as a failure.
          # The directory of the app carries the name of the app, which follows
          # the language of the release, so only the end of the name is fixed.
          listing=$(tar -tzf "$RUNNER_TEMP/$TARBALL")
          for path in '/App$' '/io\.github\.cax\.anser\.desktop$' \
                      '/io\.github\.cax\.anser\.png$' '/nsh/app\.json$' \
                      '/nsh/bundle\.nshc$' '/nsh/capabilities\.json$'; do
            grep -qE "^[^/]+${path}" <<<"$listing" || {
              echo "$TARBALL does not hold a file that ends with $path" >&2
              exit 1
            }
          done

          # Only the program is unpacked: the whole archive is over twenty
          # megabytes.
          mkdir -p "$RUNNER_TEMP/payload"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$RUNNER_TEMP/payload"
          appdir=$(find "$RUNNER_TEMP/payload" -mindepth 1 -maxdepth 1 -type d -print -quit)

          # LC_ALL=C keeps the header readable on any runner locale.
          header=$(LC_ALL=C readelf -h "$appdir/App")
          grep -q "Machine:.*X86-64" <<<"$header" || {
            echo "The program of $TARBALL is not an x86_64 executable" >&2
            exit 1
          }

          # The licence of the program is taken from the repository.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "https://github.com/ca-x/anser/raw/refs/tags/v${VERSION}/LICENSE" \
            --output "$RUNNER_TEMP/LICENSE"
          grep -q "Apache License" "$RUNNER_TEMP/LICENSE" || {
            echo "The licence of release v$VERSION is not the Apache licence" >&2
            exit 1
          }

      - name: Run the packaged program
        if: steps.compare.outputs.package_update == 'true'
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: |
          set -euo pipefail

          # The program is a graphical application that shows a web view. The
          # runner carries neither GTK 4 nor WebKitGTK 6.0 by itself.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkitgtk-6.0-4 libgtk-4-1 libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 libsoup-3.0-0 libharfbuzz0b \
            libfontconfig1 libpango-1.0-0 libcairo2 libglib2.0-0t64 \
            libgraphene-1.0-0 xvfb xauth

          ROOT="$RUNNER_TEMP/root"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          tar -xzf "$RUNNER_TEMP/$TARBALL" -C "$ROOT"
          appdir=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print -quit)

          # Every library the program needs must be there; a missing one shows
          # up as "not found".
          missing=$(ldd "$appdir/App" | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "The program misses libraries:" >&2
            echo "$missing" >&2
            exit 1
          fi

          # It must open its window on a virtual display. A program that ends
          # on its own has shown the window and gone; one that keeps running
          # until the time is up is waiting for a person.
          set +e
          timeout 30 xvfb-run -a "$appdir/App" >"$RUNNER_TEMP/app.out" 2>"$RUNNER_TEMP/app.err"
          code=$?
          set -e
          if grep -qi "cannot open shared object file" "$RUNNER_TEMP/app.err"; then
            echo "The packaged program could not load a library" >&2
            cat "$RUNNER_TEMP/app.err" >&2
            exit 1
          fi
          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "The packaged program ended with status $code" >&2
            cat "$RUNNER_TEMP/app.err" >&2
            exit 1
          fi

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: |
          set -euo pipefail
          cd anser-client-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

          # The name of the file in the release does not change with the
          # version. If the upstream changes it, the PKGBUILD has to follow
          # by hand.
          EXPECTED="anser-client-linux-x86_64.tar.gz"
          if [ "$TARBALL" != "$EXPECTED" ]; then
            echo "The release calls the file $TARBALL, the PKGBUILD expects $EXPECTED" >&2
            exit 1
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: anser-client-bin
          pkgbuild: ./anser-client-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for anser-client-bin {0}', steps.release.outputs.version) || format('Update anser-client-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add anser-client-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for anser-client-bin $VERSION"
          else
            git commit -m "Update anser-client-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
