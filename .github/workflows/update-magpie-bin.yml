name: Update magpie-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version. Leave empty to read https://usemagpie.ai/api/latest."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-magpie-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            https://usemagpie.ai/api/latest --output release.json

          jq -e '
            (.version | type == "string" and test("^[0-9]+([.][0-9]+)+$"))
            and (.assets | type == "object")
          ' release.json >/dev/null
          VERSION=$(jq -er '.version' release.json)

          for asset in magpie-linux-amd64 magpie-linux-arm64 magpie-cli-linux-amd64 magpie-cli-linux-arm64; do
            jq -e --arg asset "$asset" '
              .assets[$asset]
              | (.url | type == "string" and startswith("https://"))
                and (.sha256 | type == "string" and test("^[a-f0-9]{64}$"))
                and (.size | type == "number" and . > 0)
            ' release.json >/dev/null
          done

          # The feed must point at an immutable, versioned release.
          jq -e --arg needle "/releases/download/v${VERSION}/" \
            '[.assets[] | .url] | all(contains($needle))' release.json >/dev/null

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            REQUESTED="${INPUT_VERSION#v}"
            [[ "$REQUESTED" == "$VERSION" ]] || {
              echo "Requested version $REQUESTED does not match upstream $VERSION" >&2
              exit 1
            }
          fi

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' magpie-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' magpie-bin/PKGBUILD)
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=magpie-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "$AUR_VERSION" ]] && dpkg --compare-versions "$AUR_VERSION" gt "$LATEST_VERSION-$CURRENT_REL"; then
            echo "AUR is ahead; reconcile GitHub state before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [[ "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [[ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [[ "${FORCE_UPDATE:-false}" == true ]]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Validate architecture payloads
        if: steps.compare.outputs.package_update == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          while IFS=: read -r arch asset machine; do
            url=$(jq -er --arg asset "$asset" '.assets[$asset].url' release.json)
            sum=$(jq -er --arg asset "$asset" '.assets[$asset].sha256' release.json)
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
              "$url" --output "$RUNNER_TEMP/$asset"
            printf '%s  %s\n' "$sum" "$RUNNER_TEMP/$asset" | sha256sum --check
            readelf -h "$RUNNER_TEMP/$asset" | grep -F "$machine" >/dev/null
            echo "verified $asset for $arch"
          done <<'EOF'
          x86_64:magpie-linux-amd64:Advanced Micro Devices X86-64
          aarch64:magpie-linux-arm64:AArch64
          x86_64:magpie-cli-linux-amd64:Advanced Micro Devices X86-64
          aarch64:magpie-cli-linux-arm64:AArch64
          EOF

          chmod +x "$RUNNER_TEMP/magpie-cli-linux-amd64"
          [[ "$("$RUNNER_TEMP/magpie-cli-linux-amd64" --version)" == "magpie $VERSION" ]]

          # Auxiliary sources consumed by updpkgsums must exist for this version.
          for url in \
            "https://raw.githubusercontent.com/yetone/magpie/v${VERSION}/LICENSE" \
            "https://usemagpie.ai/img/icon-256.png"; do
            curl --fail --silent --show-error --location --head \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              "$url" --output /dev/null
          done

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd magpie-bin
          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [[ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: magpie-bin
          pkgbuild: ./magpie-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for magpie-bin {0}', steps.release.outputs.version) || format('Update magpie-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add magpie-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo 'AUR publication required no GitHub metadata change.'
            exit 0
          fi
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for magpie-bin $VERSION"
          else
            git commit -m "Update magpie-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
