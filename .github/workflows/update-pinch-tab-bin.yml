name: Update pinch-tab-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.15.2). Leave empty to auto-detect latest release."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-pinch-tab-bin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Get latest release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION=$(curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              https://api.github.com/repos/pinchtab/pinchtab/releases/latest |
              jq -er '.tag_name | sub("^v"; "")')
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Unsupported or empty version: $VERSION" >&2
            exit 1
          }
          for asset in pinchtab-linux-amd64 pinchtab-linux-arm64; do
            curl --fail --silent --show-error --location --head \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              "https://github.com/pinchtab/pinchtab/releases/download/v${VERSION}/${asset}" >/dev/null
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          LATEST: ${{ steps.release.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          CURRENT=$(sed -n 's/^pkgver=//p' pinch-tab-bin/PKGBUILD)
          if [[ "$LATEST" == "$CURRENT" ]]; then
            if [[ "$FORCE" == "true" ]]; then
              echo "update=true" >> "$GITHUB_OUTPUT"
              echo "bump=true" >> "$GITHUB_OUTPUT"
            else
              echo "update=false" >> "$GITHUB_OUTPUT"
            fi
          else
            [[ $(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n1) == "$CURRENT" ]] || {
              echo "Refusing automatic downgrade from $CURRENT to $LATEST" >&2
              exit 1
            }
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PKGBUILD
        if: steps.compare.outputs.update == 'true'
        env:
          LATEST: ${{ steps.release.outputs.version }}
          BUMP: ${{ steps.compare.outputs.bump }}
        run: |
          set -euo pipefail
          cd pinch-tab-bin
          if [[ "$BUMP" == "true" ]]; then
            REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: pinch-tab-bin
          pkgbuild: ./pinch-tab-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update pinch-tab-bin to ${{ steps.release.outputs.version }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit successful update to GitHub
        if: steps.compare.outputs.update == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pinch-tab-bin/PKGBUILD
          git commit -m "Update pinch-tab-bin to ${{ steps.release.outputs.version }}"
          git push
