name: Update luvus-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version (for example, 0.12.0). Leave empty to detect the latest release."
        required: false
        type: string
      force:
        description: "Force a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-luvus-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            RELEASE_JSON=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/RizRiyz/luvus/releases/tags/v${VERSION}")
          else
            RELEASE_JSON=$(curl --fail --silent --show-error --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/RizRiyz/luvus/releases/latest)
            VERSION=$(jq -er '.tag_name | select(type == "string" and length > 0) | sub("^v"; "")' <<<"${RELEASE_JSON}")
          fi
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Unsupported upstream version: ${VERSION}" >&2; exit 1; }
          for asset in "luvus-v${VERSION}-x86_64-unknown-linux-musl.tar.gz" "luvus-v${VERSION}-aarch64-unknown-linux-musl.tar.gz"; do
            jq -e --arg asset "${asset}" '.assets[] | select(.name == $asset)' <<<"${RELEASE_JSON}" >/dev/null || { echo "Release v${VERSION} is missing ${asset}" >&2; exit 1; }
          done
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify Linux archives are reachable
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            curl --fail --silent --show-error --location --head --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 120 "https://github.com/RizRiyz/luvus/releases/download/v${VERSION}/luvus-v${VERSION}-${arch}-unknown-linux-musl.tar.gz" >/dev/null
          done

      - name: Decide whether to publish
        id: compare
        env:
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          FORCE_UPDATE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^pkgver=//p' luvus-bin/PKGBUILD)
          rel=$(sed -n 's/^pkgrel=//p' luvus-bin/PKGBUILD)
          [[ "${current}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ && "${rel}" =~ ^[0-9]+$ ]]
          if [[ "${LATEST_VERSION}" != "${current}" ]]; then
            oldest=$(printf '%s\n%s\n' "${current}" "${LATEST_VERSION}" | sort -V | head -n1)
            [[ "${oldest}" == "${current}" ]] || { echo "Refusing automatic downgrade from ${current} to ${LATEST_VERSION}" >&2; exit 1; }
            echo "needs_update=true" >> "${GITHUB_OUTPUT}"; echo "bump_rel=false" >> "${GITHUB_OUTPUT}"
          elif [[ "${FORCE_UPDATE:-false}" == true ]]; then
            echo "needs_update=true" >> "${GITHUB_OUTPUT}"; echo "bump_rel=true" >> "${GITHUB_OUTPUT}"
          else
            echo "needs_update=false" >> "${GITHUB_OUTPUT}"; echo "bump_rel=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Stage PKGBUILD
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
        run: |
          set -euo pipefail
          cd luvus-bin
          if [[ "${BUMP_REL}" == true ]]; then
            rel=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((rel + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=${LATEST_VERSION}/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: luvus-bin
          pkgbuild: ./luvus-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for luvus-bin {0}', steps.release.outputs.version) || format('Update luvus-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Record successful publication in GitHub
        if: steps.compare.outputs.needs_update == 'true'
        env:
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add luvus-bin/PKGBUILD
          if [[ "${BUMP_REL}" == true ]]; then git commit -m "Bump pkgrel for luvus-bin ${LATEST_VERSION}"; else git commit -m "Update luvus-bin to version ${LATEST_VERSION}"; fi
          git push
