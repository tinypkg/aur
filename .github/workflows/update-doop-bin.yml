name: Update doop-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected desktop version, e.g. 0.11.0. Leave empty to detect the latest desktop release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 */12 * * *"

concurrency:
  group: aur-doop-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          REQ="${INPUT_VERSION:-}"
          REQ="${REQ#v}"

          if [ -n "$REQ" ]; then
            [[ "$REQ" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
              echo "Unsupported upstream version: $REQ" >&2
              exit 1
            }
            MANIFEST="https://github.com/kgoedecke/doop/releases/download/desktop-v$REQ/latest.json"
          else
            # doop publishes the Tauri desktop updater feed to a rolling release on
            # every desktop-v* tag; tags without a deb asset (server/CLI releases) never
            # touch this manifest, so it is the authoritative desktop version source.
            MANIFEST="https://github.com/kgoedecke/doop/releases/download/desktop-updates/latest.json"
          fi

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            "$MANIFEST" --output manifest-raw.json
          jq . manifest-raw.json > manifest.json

          VERSION=$(jq -er '.version | select(type == "string" and length > 0)' manifest.json)
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Manifest carries an unusable version: $VERSION" >&2
            exit 1
          }
          if [ -n "$REQ" ] && [ "$VERSION" != "$REQ" ]; then
            echo "Manifest version $VERSION does not match requested $REQ" >&2
            exit 1
          fi

          # The manifest must point at the immutable asset path of the desktop-v* tag.
          DEB_URL=$(jq -er '.platforms["linux-x86_64-deb"].url | select(type == "string" and length > 0)' manifest.json)
          EXPECTED="https://github.com/kgoedecke/doop/releases/download/desktop-v${VERSION}/doop_${VERSION}_amd64.deb"
          if [ "$DEB_URL" != "$EXPECTED" ]; then
            echo "Manifest deb URL does not match the versioned asset path: $DEB_URL" >&2
            exit 1
          fi

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' doop-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' doop-bin/PKGBUILD)

          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=doop-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [ -n "$AUR_VERSION" ] && [ "$AUR_VERSION" != "$AHEAD_REF" ] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | head -n1)" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify upstream payload
        if: steps.compare.outputs.package_update == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          DEB_URL=$(jq -er '.platforms["linux-x86_64-deb"].url' manifest.json)
          OUT="$RUNNER_TEMP/doop_${VERSION}_amd64.deb"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1800 \
            "$DEB_URL" --output "$OUT"

          DEB_VERSION=$(dpkg-deb --field "$OUT" Version)
          DEB_ARCH=$(dpkg-deb --field "$OUT" Architecture)
          [ "$DEB_VERSION" = "$VERSION" ] || {
            echo "deb Version $DEB_VERSION does not match manifest $VERSION" >&2
            exit 1
          }
          [ "$DEB_ARCH" = "amd64" ] || {
            echo "deb Architecture is $DEB_ARCH, expected amd64" >&2
            exit 1
          }
          dpkg-deb --contents "$OUT" > "$RUNNER_TEMP/doop-contents.txt"
          grep -qE '(^|/)usr/bin/doop-desktop$' "$RUNNER_TEMP/doop-contents.txt" || {
            echo "deb does not ship /usr/bin/doop-desktop; listing follows:" >&2
            cat "$RUNNER_TEMP/doop-contents.txt" >&2
            exit 1
          }
          echo "verified deb $DEB_VERSION ($DEB_ARCH)"

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd doop-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: doop-bin
          pkgbuild: ./doop-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for doop-bin {0}', steps.release.outputs.version) || format('Update doop-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add doop-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for doop-bin $VERSION"
          else
            git commit -m "Update doop-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
