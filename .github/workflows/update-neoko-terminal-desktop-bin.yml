name: Update neoko-terminal-desktop-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.4.1). Leave empty to detect the latest desktop release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "9 */12 * * *"

concurrency:
  group: aur-neoko-terminal-desktop-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }

          # This repository ships the LPK/webshell as its main releases and the
          # desktop client under a separate "neoko-terminal-desktop-v*" tag, so
          # releases/latest is never the desktop build. Pick the newest release
          # whose tag matches the desktop prefix instead.
          TAG_RE='^neoko-terminal-desktop-v([0-9]+([.][0-9]+)+)$'

          releases=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lazycat-contrib/lazycat-neko-webshell/releases?per_page=100") ||
            fail "Could not read the releases from GitHub"

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || fail "Unsupported version: $VERSION"
            TAG="neoko-terminal-desktop-v$VERSION"
          else
            echo "desktop releases: $(jq -r '[.[]
                    | select(.tag_name | startswith("neoko-terminal-desktop-v"))
                    | "\(.tag_name)(draft=\(.draft|tostring) pre=\(.prerelease|tostring) type=\(.draft|type))"] | join(" ")' <<< "$releases")"
            # Compare the flags as strings: the runner's jq dropped every
            # release when `.draft == false` was evaluated directly, while
            # string forms of the same filter work there.
            TAG=$(jq -r '.[]
                    | .tag_name as $t
                    | select($t | startswith("neoko-terminal-desktop-v"))
                    | select((.draft | tostring) == "false" and (.prerelease | tostring) == "false")
                    | $t' <<< "$releases" | sort -V | tail -n1)
            [[ -n "$TAG" ]] || {
              echo "desktop tags seen: $(jq -r '[.[]
                    | select(.tag_name | startswith("neoko-terminal-desktop-v"))
                    | "\(.tag_name)(draft=\(.draft) pre=\(.prerelease))"] | join(" ")' <<< "$releases")" >&2
              fail "No stable neoko-terminal-desktop-v* release found"
            }
            VERSION="${TAG#neoko-terminal-desktop-v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || fail "Unsupported version: $VERSION"

          release=$(curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/lazycat-contrib/lazycat-neko-webshell/releases/tags/$TAG") ||
            fail "Release $TAG does not exist"
          # releases/tags can return a draft sharing the tag name (this repo has
          # done that), so verify the release actually published and is no draft.
          jq -e '.draft == false' <<< "$release" > /dev/null ||
            fail "Release $TAG is a draft"
          jq -e '.prerelease == false' <<< "$release" > /dev/null ||
            fail "Release $TAG is a prerelease"
          jq -e --arg t "$TAG" '.tag_name == $t' <<< "$release" > /dev/null ||
            fail "GitHub returned an unexpected tag for $TAG"

          BASE="https://github.com/lazycat-contrib/lazycat-neko-webshell/releases/download/$TAG"
          name="neoko-terminal-${VERSION}-x86_64-unknown-linux-gnu.deb"
          jq -e --arg n "$name" 'any(.assets[]; .name == $n and .size > 0)' <<< "$release" > /dev/null ||
            fail "Release $TAG has no $name asset"

          # The release publishes one .sha256 sidecar per deb asset.
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "$BASE/$name.sha256" --output asset.sha256 ||
            fail "Release $TAG has no $name.sha256"
          want=$(awk '{ print $1; exit }' asset.sha256)
          [[ "$want" =~ ^[0-9a-f]{64}$ ]] || fail "$name.sha256 has no usable hash"

          out="$RUNNER_TEMP/$name"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1800 \
            "$BASE/$name" --output "$out"
          got=$(sha256sum "$out" | cut -d' ' -f1)
          [ "$got" = "$want" ] || fail "Checksum mismatch for $name: got $got want $want"

          deb_version=$(dpkg-deb --field "$out" Version)
          deb_arch=$(dpkg-deb --field "$out" Architecture)
          [ "$deb_version" = "$VERSION" ] ||
            fail "$name carries Version $deb_version, expected $VERSION"
          [ "$deb_arch" = "amd64" ] ||
            fail "$name carries Architecture $deb_arch, expected amd64"

          dpkg-deb --contents "$out" > "$RUNNER_TEMP/contents.txt"
          for path in 'usr/bin/neoko-terminal$' \
                      'usr/share/applications/community\.lazycat\.neko\.remoted\.desktop$' \
                      'usr/share/pixmaps/community\.lazycat\.neko\.remoted\.png$' \
                      'usr/share/doc/neoko-terminal/licenses/NEKO-LICENSE$'; do
            grep -qE "$path" "$RUNNER_TEMP/contents.txt" || {
              echo "$name is missing an expected payload path ($path); listing follows:" >&2
              cat "$RUNNER_TEMP/contents.txt" >&2
              exit 1
            }
          done
          echo "verified $name ($deb_version, $deb_arch)"

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' neoko-terminal-desktop-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' neoko-terminal-desktop-bin/PKGBUILD)

          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=neoko-terminal-desktop-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [ -n "$AUR_VERSION" ] && [ "$AUR_VERSION" != "$AHEAD_REF" ] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | head -n1)" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd neoko-terminal-desktop-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: neoko-terminal-desktop-bin
          pkgbuild: ./neoko-terminal-desktop-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for neoko-terminal-desktop-bin {0}', steps.release.outputs.version) || format('Update neoko-terminal-desktop-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add neoko-terminal-desktop-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for neoko-terminal-desktop-bin $VERSION"
          else
            git commit -m "Update neoko-terminal-desktop-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
