name: Update subnetdesk-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.3.0). Leave empty to auto-detect latest version from GitHub Releases."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-subnetdesk-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get latest version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_VERSION" ]; then
            echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
              https://api.github.com/repos/zibo-chen/SubnetDesk/releases/latest |
              jq -er '.tag_name | sub("^v"; "")')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' subnetdesk-bin/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        env:
          LATEST: ${{ steps.get_version.outputs.version }}
          CURRENT: ${{ steps.current_version.outputs.current }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          if [ "$LATEST" = "$CURRENT" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "needs_update=true" >> "$GITHUB_OUTPUT"
              echo "bump_rel=true" >> "$GITHUB_OUTPUT"
            else
              echo "needs_update=false" >> "$GITHUB_OUTPUT"
              echo "Version $CURRENT is already up to date"
            fi
          else
            if [ "$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n1)" != "$CURRENT" ]; then
              echo "refusing automatic downgrade from $CURRENT to $LATEST" >&2
              exit 1
            fi
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "bump_rel=false" >> "$GITHUB_OUTPUT"
            echo "Updating from $CURRENT to $LATEST"
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cd subnetdesk-bin
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=${{ steps.get_version.outputs.version }}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subnetdesk-bin/PKGBUILD
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            git commit -m "Bump pkgrel for subnetdesk-bin ${{ steps.get_version.outputs.version }}"
          else
            git commit -m "Update subnetdesk-bin to version ${{ steps.get_version.outputs.version }}"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: subnetdesk-bin
          pkgbuild: ./subnetdesk-bin/PKGBUILD
          assets: ./subnetdesk-bin/subnetdesk-bin.install
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.version) || format('Update to version {0}', steps.get_version.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
