name: Update xerj-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag without the v prefix (e.g., 1.0.0-rc.98). Leave empty to auto-detect latest."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-main
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAGVER="${{ github.event.inputs.version }}"
          else
            TAGVER=$(curl --fail --silent --show-error --location --retry 3 \
              --header "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/xerj-org/xerj/releases/latest | \
              jq -er '.tag_name | strings | select(length > 0)')
            TAGVER="${TAGVER#v}"
          fi
          # pkgver must not contain '-': map pre-release tags 1.0.0-rc.98 -> 1.0.0rc.98
          PKGVER="${TAGVER/-/}"
          [[ "$PKGVER" =~ ^[0-9][0-9A-Za-z._]*$ ]] || { echo "unexpected version: $PKGVER" >&2; exit 1; }
          echo "tagver=$TAGVER" >> $GITHUB_OUTPUT
          echo "pkgver=$PKGVER" >> $GITHUB_OUTPUT

      - name: Verify both assets exist
        run: |
          set -euo pipefail
          T="${{ steps.get_version.outputs.tagver }}"
          for a in x86_64 aarch64; do
            STATUS=$(curl --fail --silent --show-error --location --retry 3 -r 0-1023 -o /dev/null -w '%{http_code}' \
              "https://github.com/xerj-org/xerj/releases/download/v${T}/xerj-${T}-${a}-unknown-linux-gnu.tar.gz")
            [ "$STATUS" = "206" ] || [ "$STATUS" = "200" ] || { echo "missing ${a} asset (HTTP $STATUS)" >&2; exit 1; }
          done

      - name: Get current version
        id: current_version
        run: |
          echo "current=$(grep '^pkgver=' xerj-bin/PKGBUILD | cut -d'=' -f2)" >> $GITHUB_OUTPUT
          echo "current_tag=$(grep '^_tagver=' xerj-bin/PKGBUILD | cut -d'=' -f2 | tr -d '"')" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        env:
          LATEST: ${{ steps.get_version.outputs.pkgver }}
          LATEST_TAG: ${{ steps.get_version.outputs.tagver }}
          CURRENT: ${{ steps.current_version.outputs.current }}
          CURRENT_TAG: ${{ steps.current_version.outputs.current_tag }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ "$LATEST" = "$CURRENT" ] && [ "$LATEST_TAG" = "$CURRENT_TAG" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "needs_update=true" >> $GITHUB_OUTPUT
              echo "bump_rel=true" >> $GITHUB_OUTPUT
            else
              echo "needs_update=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=false" >> $GITHUB_OUTPUT
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cd xerj-bin
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=${{ steps.get_version.outputs.pkgver }}/" PKGBUILD
            sed -i "s/^_tagver=.*/_tagver=\"${{ steps.get_version.outputs.tagver }}\"/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xerj-bin/PKGBUILD
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            git commit -m "Bump pkgrel for xerj-bin ${{ steps.get_version.outputs.pkgver }}"
          else
            git commit -m "Update xerj-bin to version ${{ steps.get_version.outputs.pkgver }}"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: xerj-bin
          pkgbuild: ./xerj-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.pkgver) || format('Update to version {0}', steps.get_version.outputs.pkgver) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
