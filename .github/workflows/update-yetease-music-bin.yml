name: Update yetease-music-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version, e.g. 0.2.3. Leave empty to detect the latest GitHub release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 */12 * * *"

concurrency:
  group: aur-yetease-music-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
              echo "Unsupported upstream version: $VERSION" >&2
              exit 1
            }
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://api.github.com/repos/Gloridust/YetEaseMusic/releases/tags/v${VERSION}" \
              --output release-raw.json
            jq -e ".draft == false" release-raw.json >/dev/null
            jq "." release-raw.json > release.json
          else
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://api.github.com/repos/Gloridust/YetEaseMusic/releases/latest" \
              --output release-raw.json
            jq -e ".draft == false and (.assets | length > 0)" release-raw.json >/dev/null
            jq "." release-raw.json > release.json
          fi

          TAG=$(jq -er ".tag_name | select(type == \"string\" and length > 0)" release.json)
          DISCOVERED_VERSION=${TAG#v}
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$VERSION" ]] || {
            echo "Release tag $TAG does not match requested version $VERSION" >&2
            exit 1
          }
          VERSION=$DISCOVERED_VERSION
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream version: $VERSION" >&2
            exit 1
          }

          for asset in \
            "yetease-music_${VERSION}_amd64.deb" \
            "SHA256SUMS"; do
            jq -e --arg asset "$asset" \
              ".assets | any(.name == \$asset and .state == \"uploaded\" and .size > 0)" \
              release.json >/dev/null || {
              echo "Release $TAG has no usable $asset" >&2
              exit 1
            }
          done

          CURRENT_VERSION=$(sed -n "s/^pkgver=//p" yetease-music-bin/PKGBUILD)
          CURRENT_REL=$(sed -n "s/^pkgrel=//p" yetease-music-bin/PKGBUILD)
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=yetease-music-bin" |
              jq -er "if .resultcount == 0 then \"\" else .results[0].Version end"
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$AUR_VERSION" ] && dpkg --compare-versions "$AUR_VERSION" gt "$LATEST_VERSION-$CURRENT_REL"; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf "%s\n%s\n" "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify deb payload
        if: steps.compare.outputs.package_update == "true"
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          BASE="https://github.com/Gloridust/YetEaseMusic/releases/download/v${VERSION}"
          deb="yetease-music_${VERSION}_amd64.deb"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1200 \
            "$BASE/SHA256SUMS" --output "$RUNNER_TEMP/SHA256SUMS"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1200 \
            "$BASE/$deb" --output "$RUNNER_TEMP/$deb"
          (cd "$RUNNER_TEMP" && grep " $deb\$" SHA256SUMS | sha256sum --check)
          deb_version=$(dpkg-deb --field "$RUNNER_TEMP/$deb" Version)
          deb_arch=$(dpkg-deb --field "$RUNNER_TEMP/$deb" Architecture)
          [[ "$deb_version" == "$VERSION" ]] || {
            echo "deb version $deb_version does not match release $VERSION" >&2
            exit 1
          }
          [[ "$deb_arch" == "amd64" ]] || {
            echo "deb architecture $deb_arch is not amd64" >&2
            exit 1
          }
          echo "verified $deb"

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == "true"
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd yetease-music-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n "s/^pkgrel=//p" PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n "s/^pkgver=//p" PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == "true"
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: yetease-music-bin
          pkgbuild: ./yetease-music-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for yetease-music-bin {0}', steps.release.outputs.version) || format('Update yetease-music-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == "true"
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add yetease-music-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for yetease-music-bin $VERSION"
          else
            git commit -m "Update yetease-music-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
