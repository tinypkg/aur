name: Update deepseek-harness-desktop-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version, e.g. 0.2.0-rc.2. Leave empty to detect the latest desktop-v* GitHub release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "15 */12 * * *"

concurrency:
  group: aur-deepseek-harness-desktop-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            UPSTREAM_VERSION="${INPUT_VERSION#desktop-v}"
            RELEASE_API="https://api.github.com/repos/ZacharyZhang-NY/deepseek-harness/releases/tags/desktop-v${UPSTREAM_VERSION}"
          else
            RELEASE_API="https://api.github.com/repos/ZacharyZhang-NY/deepseek-harness/releases/latest"
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${{ github.token }}" \
            "$RELEASE_API" --output release.json

          jq -e '(.draft == false) and (.prerelease == false)' release.json >/dev/null
          TAG=$(jq -er '.tag_name | select(type == "string" and length > 0)' release.json)
          [[ "$TAG" == desktop-v* ]] || {
            echo "Release tag $TAG is not a desktop-v* release" >&2
            exit 1
          }
          DISCOVERED_VERSION=${TAG#desktop-v}
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$UPSTREAM_VERSION" ]] || {
            echo "Release tag $TAG does not match requested version $UPSTREAM_VERSION" >&2
            exit 1
          }
          UPSTREAM_VERSION=$DISCOVERED_VERSION
          [[ "$UPSTREAM_VERSION" =~ ^[0-9]+([.][0-9]+)+([-][0-9A-Za-z.]+)?$ ]] || {
            echo "Unsupported upstream version: $UPSTREAM_VERSION" >&2
            exit 1
          }
          # Arch pkgver cannot contain dashes.
          PKGVER=${UPSTREAM_VERSION//-/}

          DEB="deepseek-harness-${UPSTREAM_VERSION}-linux-amd64.deb"
          for asset in "$DEB" SHA256SUMS; do
            jq -e --arg asset "$asset" \
              '.assets | any(.name == $asset and .state == "uploaded" and .size > 0)' \
              release.json >/dev/null || {
              echo "Release $TAG has no usable $asset" >&2
              exit 1
            }
          done

          CURRENT_VERSION=$(sed -n 's/^_pkgver=//p' deepseek-harness-desktop-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' deepseek-harness-desktop-bin/PKGBUILD)
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=deepseek-harness-desktop-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"
          echo "pkgver=$PKGVER" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          LATEST_PKGVER: ${{ steps.release.outputs.pkgver }}
        run: |
          set -euo pipefail

          if [ -n "$AUR_VERSION" ] && dpkg --compare-versions "$AUR_VERSION" gt "$LATEST_PKGVER-$CURRENT_REL"; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$LATEST_PKGVER-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify deb payload
        if: steps.compare.outputs.package_update == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          DEB="deepseek-harness-${VERSION}-linux-amd64.deb"
          BASE="https://github.com/ZacharyZhang-NY/deepseek-harness/releases/download/desktop-v${VERSION}"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1200 \
            "$BASE/$DEB" --output "$RUNNER_TEMP/$DEB"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "$BASE/SHA256SUMS" --output "$RUNNER_TEMP/SHA256SUMS"

          (cd "$RUNNER_TEMP" && grep " ${DEB}\$" SHA256SUMS | sha256sum --check)

          deb_version=$(dpkg-deb --field "$RUNNER_TEMP/$DEB" Version)
          deb_arch=$(dpkg-deb --field "$RUNNER_TEMP/$DEB" Architecture)
          [[ "$deb_version" == "${VERSION//-/\~}" ]] || {
            echo "deb version $deb_version does not match release $VERSION" >&2
            exit 1
          }
          [[ "$deb_arch" == "amd64" ]] || {
            echo "deb architecture $deb_arch is not amd64" >&2
            exit 1
          }

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd deepseek-harness-desktop-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^_pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^_pkgver=.*/_pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: deepseek-harness-desktop-bin
          pkgbuild: ./deepseek-harness-desktop-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for deepseek-harness-desktop-bin {0}', steps.release.outputs.version) || format('Update deepseek-harness-desktop-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deepseek-harness-desktop-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for deepseek-harness-desktop-bin $VERSION"
          else
            git commit -m "Update deepseek-harness-desktop-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
