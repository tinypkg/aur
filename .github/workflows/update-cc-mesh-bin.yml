name: Update cc-mesh-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version. Leave empty to detect the latest GitHub release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: "Allow an explicitly requested version to downgrade the package"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-cc-mesh-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
              echo "Unsupported requested version: $VERSION" >&2
              exit 1
            }
            RELEASE_API="https://api.github.com/repos/VkRainB/ccMesh/releases/tags/v${VERSION}"
          else
            RELEASE_API="https://api.github.com/repos/VkRainB/ccMesh/releases/latest"
          fi

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "$RELEASE_API" --output release.json

          jq -e '.draft == false and .prerelease == false' release.json >/dev/null || {
            echo "The requested release is not a published stable release" >&2
            exit 1
          }
          DISCOVERED_VERSION=$(jq -er '.tag_name | select(type == "string" and length > 0) | sub("^v"; "")' release.json)
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$VERSION" ]] || {
            echo "Release tag v$DISCOVERED_VERSION does not match requested version $VERSION" >&2
            exit 1
          }
          VERSION=$DISCOVERED_VERSION
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream version: $VERSION" >&2
            exit 1
          }

          ASSET="ccMesh_${VERSION}_amd64.deb"
          ASSET_URL=$(jq -er --arg asset "$ASSET" '
            [.assets[] | select(.name == $asset and .state == "uploaded" and .size > 0)] |
            if length == 1 then .[0].browser_download_url else error("missing or duplicate release asset") end
          ' release.json)
          ASSET_DIGEST=$(jq -r --arg asset "$ASSET" '
            [.assets[] | select(.name == $asset)] | if length == 1 then .[0].digest // "" else "" end
          ' release.json)

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' cc-mesh-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' cc-mesh-bin/PKGBUILD)
          [[ "$CURRENT_VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]]
          [[ "$CURRENT_REL" =~ ^[1-9][0-9]*$ ]]

          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=cc-mesh-bin' |
              jq -er '
                if .resultcount == 0 then ""
                elif .resultcount == 1 and .results[0].Name == "cc-mesh-bin" then .results[0].Version
                else error("unexpected AUR RPC response")
                end
              '
          )
          [[ -z "$AUR_VERSION" || "$AUR_VERSION" =~ ^[0-9]+([.][0-9]+)+-[1-9][0-9]*$ ]] || {
            echo "Unsupported AUR package version: $AUR_VERSION" >&2
            exit 1
          }

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"
          echo "asset_digest=$ASSET_DIGEST" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PACKAGE_UPDATE=false
          BUMP_REL=false
          TARGET_STATE="$CURRENT_VERSION-$CURRENT_REL"
          if [[ "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" && \
                  ( -z "${MANUAL_VERSION:-}" || "${ALLOW_DOWNGRADE:-false}" != true ) ]]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION without allow_downgrade" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
            TARGET_STATE="$LATEST_VERSION-1"
          elif [[ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [[ "${FORCE_UPDATE:-false}" == true ]]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
            TARGET_STATE="$CURRENT_VERSION-$((CURRENT_REL + 1))"
          fi

          if [[ "$PACKAGE_UPDATE" == true && -n "$AUR_VERSION" && "$TARGET_STATE" != "$AUR_VERSION" ]]; then
            OLDEST_STATE=$(printf '%s\n%s\n' "$TARGET_STATE" "$AUR_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_STATE" == "$TARGET_STATE" && \
                  ( -z "${MANUAL_VERSION:-}" || "${ALLOW_DOWNGRADE:-false}" != true ) ]]; then
              echo "Refusing to replace newer AUR state $AUR_VERSION with $TARGET_STATE without an explicit manual downgrade" >&2
              exit 1
            fi
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify Debian package metadata
        if: steps.compare.outputs.package_update == 'true'
        env:
          ASSET_DIGEST: ${{ steps.release.outputs.asset_digest }}
          ASSET_URL: ${{ steps.release.outputs.asset_url }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 900 \
            "$ASSET_URL" --output ccmesh.deb

          if [[ -n "$ASSET_DIGEST" ]]; then
            [[ "$ASSET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "Unsupported release asset digest: $ASSET_DIGEST" >&2
              exit 1
            }
            echo "${ASSET_DIGEST#sha256:}  ccmesh.deb" | sha256sum --check --status
          fi

          DEB_VERSION=$(dpkg-deb --field ccmesh.deb Version)
          DEB_ARCH=$(dpkg-deb --field ccmesh.deb Architecture)
          DEB_PACKAGE=$(dpkg-deb --field ccmesh.deb Package)
          [[ "$DEB_PACKAGE" == cc-mesh ]] || {
            echo "Unexpected Debian package name: $DEB_PACKAGE" >&2
            exit 1
          }
          [[ "$DEB_VERSION" == "$EXPECTED_VERSION" ]] || {
            echo "Debian package version $DEB_VERSION does not match release $EXPECTED_VERSION" >&2
            exit 1
          }
          [[ "$DEB_ARCH" == amd64 ]] || {
            echo "Unexpected Debian package architecture: $DEB_ARCH" >&2
            exit 1
          }

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd cc-mesh-bin
          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: cc-mesh-bin
          pkgbuild: ./cc-mesh-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for cc-mesh-bin {0}', steps.release.outputs.version) || format('Update cc-mesh-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git add cc-mesh-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "GitHub package state is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for cc-mesh-bin $VERSION"
          else
            git commit -m "Update cc-mesh-bin to version $VERSION"
          fi
          git push
