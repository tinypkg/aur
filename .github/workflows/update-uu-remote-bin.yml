name: Update UU-Remote-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.1.5). Leave empty to auto-detect latest version."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-main
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(curl --fail --silent --show-error --location --retry 3 \
              --header "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/VallierDev/uu-remote-linux/releases/latest | \
              jq -er '.tag_name | strings | select(length > 0)')
            VERSION="${VERSION#v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Verify asset exists
        run: |
          set -euo pipefail
          ASSET="uu-remote-linux-v${{ steps.get_version.outputs.version }}-x86_64-linux.tar.gz"
          STATUS=$(curl --fail --silent --show-error --location --retry 3 -o /dev/null -w '%{http_code}' \
            "https://github.com/VallierDev/uu-remote-linux/releases/download/v${{ steps.get_version.outputs.version }}/${ASSET}")
          [ "$STATUS" = "200" ] || { echo "asset not found for version ${{ steps.get_version.outputs.version }}" >&2; exit 1; }

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' uu-remote-bin/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.get_version.outputs.version }}" = "${{ steps.current_version.outputs.current }}" ]; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "needs_update=true" >> $GITHUB_OUTPUT
              echo "bump_rel=true" >> $GITHUB_OUTPUT
              echo "Forcing pkgrel bump for version ${{ steps.get_version.outputs.version }}"
            else
              echo "needs_update=false" >> $GITHUB_OUTPUT
              echo "Version ${{ steps.get_version.outputs.version }} is already up to date"
            fi
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=false" >> $GITHUB_OUTPUT
            echo "Updating from ${{ steps.current_version.outputs.current }} to ${{ steps.get_version.outputs.version }}"
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cd uu-remote-bin
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            echo "Bumped pkgrel from $CURRENT_REL to $NEW_REL"
          else
            sed -i "s/^pkgver=.*/pkgver=${{ steps.get_version.outputs.version }}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            echo "Updated to version ${{ steps.get_version.outputs.version }}"
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uu-remote-bin/PKGBUILD
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            git commit -m "Bump pkgrel for uu-remote-bin ${{ steps.get_version.outputs.version }}"
          else
            git commit -m "Update uu-remote-bin to version ${{ steps.get_version.outputs.version }}"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: uu-remote-bin
          pkgbuild: ./uu-remote-bin/PKGBUILD
          assets: |-
            ./uu-remote-bin/uu-remote-bin.install
            ./uu-remote-bin/uu-remote-native.service
            ./uu-remote-bin/uu-virtual-desktop.service
            ./uu-remote-bin/60-uu-remote-linux-uinput.rules
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh . uu-remote-bin.install uu-remote-native.service uu-virtual-desktop.service 60-uu-remote-linux-uinput.rules
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.version) || format('Update to version {0}', steps.get_version.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
