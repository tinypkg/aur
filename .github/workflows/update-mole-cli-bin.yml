name: Update mole-cli-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected Linux CLI version, e.g. 0.4.0. Leave empty to detect the latest V*-linux release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "35 */12 * * *"

concurrency:
  group: aur-mole-cli-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          fail() { echo "$1" >&2; exit 1; }
          api() {
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "$1"
          }

          REQ="${INPUT_VERSION:-}"
          REQ="${REQ#V}"
          REQ="${REQ%-linux}"

          # Mole ships macOS (V1.x), Windows (V1.x-windows) and Linux (V0.x)
          # releases from one repository; only the exact V<X.Y.Z>-linux tags
          # carry the Linux CLI tarballs we package.
          if [ -n "$REQ" ]; then
            [[ "$REQ" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Unsupported Linux version: $REQ"
            VERSION="$REQ"
          else
            VERSION=""
            for page in 1 2 3 4 5; do
              body=$(api "https://api.github.com/repos/tw93/Mole/releases?per_page=100&page=$page") ||
                fail "Could not read the Mole release list from GitHub"
              candidate=$(jq -r '.[] | select(.prerelease | not) | .tag_name' <<< "$body" |
                grep -E '^V[0-9]+\.[0-9]+\.[0-9]+-linux$' |
                sed -E 's/^V(.*)-linux$/\1/' | sort -V | tail -n1) || candidate=""
              if [ -n "$candidate" ]; then
                VERSION="$candidate"
                break
              fi
              jq -e 'length > 0' <<< "$body" > /dev/null || break
            done
            [ -n "$VERSION" ] || fail "No stable V*-linux release is published for Mole"
          fi

          TAG="V${VERSION}-linux"
          release=$(api "https://api.github.com/repos/tw93/Mole/releases/tags/$TAG") ||
            fail "Release $TAG does not exist"
          jq -e '.prerelease == false' <<< "$release" > /dev/null ||
            fail "Release $TAG is a prerelease"
          jq -e --arg t "$TAG" '.tag_name == $t' <<< "$release" > /dev/null ||
            fail "GitHub returned an unexpected tag for $TAG"

          BASE="https://github.com/tw93/Mole/releases/download/$TAG"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 \
            "$BASE/SHA256SUMS.txt" --output SHA256SUMS.txt
          [ -s SHA256SUMS.txt ] || fail "SHA256SUMS.txt for $TAG is empty"

          for arch in x86_64 aarch64; do
            name="mole-${VERSION}-linux-${arch}.tar.gz"
            jq -e --arg n "$name" 'any(.assets[]; .name == $n and .size > 0)' <<< "$release" > /dev/null ||
              fail "Release $TAG has no $name asset"

            want=$(awk -v a="$name" '$2 == a || $2 == "*" a { print $1; exit }' SHA256SUMS.txt)
            [[ "$want" =~ ^[0-9a-f]{64}$ ]] || fail "$name is not listed in SHA256SUMS.txt"

            out="$RUNNER_TEMP/$name"
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --connect-timeout 15 --max-time 1200 \
              "$BASE/$name" --output "$out"
            got=$(sha256sum "$out" | cut -d' ' -f1)
            [ "$got" = "$want" ] || fail "Checksum mismatch for $name: got $got want $want"

            tree="$RUNNER_TEMP/mole-$arch"
            rm -rf "$tree" && mkdir -p "$tree"
            tar -xzf "$out" -C "$tree" --strip-components=1 --no-same-owner
            [ "$(cat "$tree/VERSION")" = "$VERSION" ] ||
              fail "$name carries VERSION $(cat "$tree/VERSION"), expected $VERSION"
            for path in mole mo bin/analyze-go bin/status-go bin/trash-go lib/core/common.sh LICENSE; do
              [ -f "$tree/$path" ] || fail "$name is missing $path"
            done
            case "$arch" in
              x86_64) expect='x86-64' ;;
              aarch64) expect='ARM aarch64' ;;
            esac
            file "$tree/bin/analyze-go" | grep -q "$expect" ||
              fail "$name ships bin/analyze-go for the wrong architecture"
            echo "verified $name ($VERSION)"
          done

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' mole-cli-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' mole-cli-bin/PKGBUILD)

          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "https://aur.archlinux.org/rpc/?v=5&type=info&arg=mole-cli-bin" |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          AHEAD_REF="$LATEST_VERSION-$CURRENT_REL"
          if [ -n "$AUR_VERSION" ] && [ "$AUR_VERSION" != "$AHEAD_REF" ] && \
             [ "$(printf '%s\n%s\n' "$AUR_VERSION" "$AHEAD_REF" | sort -V | head -n1)" = "$AHEAD_REF" ]; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd mole-cli-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: mole-cli-bin
          pkgbuild: ./mole-cli-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for mole-cli-bin {0}', steps.release.outputs.version) || format('Update mole-cli-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mole-cli-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for mole-cli-bin $VERSION"
          else
            git commit -m "Update mole-cli-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
