name: Update lzc-client-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number with v prefix (e.g., v2.0.30). Leave empty to auto-detect."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-main
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(curl --fail --silent --show-error --location --retry 3 \
              https://dl.lazycat.cloud/client/desktop/lzc-client-desktop.tar.zst.metadata.json | \
              jq -er '.buildVersion | strings | select(length > 0)')
          fi
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version format: $VERSION" >&2; exit 1; }
          PKGVER="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "pkgver=$PKGVER" >> $GITHUB_OUTPUT

      - name: Verify asset exists
        run: |
          set -euo pipefail
          # Range request: validate the versioned asset exists without downloading 300+ MB
          STATUS=$(curl --fail --silent --show-error --location --retry 3 -r 0-1023 -o /dev/null -w '%{http_code}' \
            "https://dl.lazycat.cloud/client/desktop/stable/lzc-client-desktop_${{ steps.get_version.outputs.version }}.tar.zst")
          [ "$STATUS" = "206" ] || { echo "asset not found (HTTP $STATUS) for ${{ steps.get_version.outputs.version }}" >&2; exit 1; }

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' lzc-client-bin/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.get_version.outputs.pkgver }}" = "${{ steps.current_version.outputs.current }}" ]; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "needs_update=true" >> $GITHUB_OUTPUT
              echo "bump_rel=true" >> $GITHUB_OUTPUT
              echo "Forcing pkgrel bump for version ${{ steps.get_version.outputs.pkgver }}"
            else
              echo "needs_update=false" >> $GITHUB_OUTPUT
              echo "Version ${{ steps.get_version.outputs.pkgver }} is already up to date"
            fi
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=false" >> $GITHUB_OUTPUT
            echo "Updating from ${{ steps.current_version.outputs.current }} to ${{ steps.get_version.outputs.pkgver }}"
          fi

      - name: Update PKGBUILD version and checksum
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cd lzc-client-bin
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            echo "Bumped pkgrel from $CURRENT_REL to $NEW_REL"
          else
            sed -i "s/^pkgver=.*/pkgver=${{ steps.get_version.outputs.pkgver }}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            echo "Updated to version ${{ steps.get_version.outputs.pkgver }}"
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lzc-client-bin/PKGBUILD
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            git commit -m "Bump pkgrel for lzc-client-bin ${{ steps.get_version.outputs.pkgver }}"
          else
            git commit -m "Update lzc-client-bin to version ${{ steps.get_version.outputs.pkgver }}"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: lzc-client-bin
          pkgbuild: ./lzc-client-bin/PKGBUILD
          assets: ./lzc-client-bin/lzc-client-bin.install
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh . lzc-client-bin.install
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.pkgver) || format('Update to version {0}', steps.get_version.outputs.pkgver) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
