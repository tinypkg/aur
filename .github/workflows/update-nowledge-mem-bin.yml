name: Update nowledge-mem-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 0.9.1)"
        required: true
        type: string
      force:
        description: "Force update (bump pkgrel only)"
        required: false
        default: false
        type: boolean

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' nowledge-mem-bin/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD
        id: update_pkgbuild
        run: |
          cd nowledge-mem-bin
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            echo "version=${{ steps.current_version.outputs.current }}" >> $GITHUB_OUTPUT
          else
            sed -i "s/^pkgver=.*/pkgver=${{ github.event.inputs.version }}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nowledge-mem-bin/PKGBUILD
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            git commit -m "Bump nowledge-mem-bin pkgrel"
          else
            git commit -m "Update nowledge-mem-bin to version ${{ github.event.inputs.version }}"
          fi
          git push

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: nowledge-mem-bin
          pkgbuild: ./nowledge-mem-bin/PKGBUILD
          updpkgsums: true
          test: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ github.event.inputs.force == 'true' && format('Bump pkgrel for version {0}', steps.update_pkgbuild.outputs.version) || format('Update to version {0}', steps.update_pkgbuild.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
