name: Update modbux-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version. Leave empty to detect the latest GitHub release."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
      allow_downgrade:
        description: "Allow an explicitly requested version to downgrade the package"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-modbux-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Discover and verify release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            RELEASE_API="https://api.github.com/repos/ploxc/modbux/releases/tags/v${VERSION}"
          else
            RELEASE_API="https://api.github.com/repos/ploxc/modbux/releases/latest"
          fi
          curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 2 \
            --connect-timeout 15 --max-time 120 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "$RELEASE_API" --output release.json

          DISCOVERED_VERSION=$(jq -er '.tag_name | select(type == "string" and length > 0) | sub("^v"; "")' release.json)
          [[ -z "${INPUT_VERSION:-}" || "$DISCOVERED_VERSION" == "$VERSION" ]] || {
            echo "Release tag v$DISCOVERED_VERSION does not match requested version $VERSION" >&2
            exit 1
          }
          VERSION=$DISCOVERED_VERSION
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+)+$ ]] || {
            echo "Unsupported upstream version: $VERSION" >&2
            exit 1
          }

          for arch in amd64 arm64; do
            asset="modbux_${VERSION}_${arch}.deb"
            jq -e --arg asset "$asset" \
              '.assets | any(.name == $asset and .state == "uploaded" and .size > 0)' \
              release.json >/dev/null || {
                echo "Release v$VERSION does not contain a valid $asset" >&2
                exit 1
              }
          done

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' modbux-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' modbux-bin/PKGBUILD)
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=modbux-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          ALLOW_DOWNGRADE: ${{ inputs.allow_downgrade }}
          AUR_VERSION: ${{ steps.release.outputs.aur_version }}
          CURRENT_REL: ${{ steps.release.outputs.current_rel }}
          CURRENT_VERSION: ${{ steps.release.outputs.current_version }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [[ "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" && \
                  ( -z "${MANUAL_VERSION:-}" || "${ALLOW_DOWNGRADE:-false}" != true ) ]]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION without an explicit version and allow_downgrade=true" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [[ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [[ "${FORCE_UPDATE:-false}" == true ]]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd modbux-bin
          if [[ "$BUMP_REL" == true ]]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: modbux-bin
          pkgbuild: ./modbux-bin/PKGBUILD
          assets: ./modbux-bin/LICENSE
          updpkgsums: true
          post_process: >-
            bash /github/workspace/.github/scripts/prune-aur-workdir.sh . LICENSE
            && test -f LICENSE
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for modbux-bin {0}', steps.release.outputs.version) || format('Update modbux-bin to version {0}', steps.release.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modbux-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "GitHub package state already matches the published AUR state"
          elif [[ "$BUMP_REL" == true ]]; then
            git commit -m "Bump pkgrel for modbux-bin $VERSION"
            git push
          else
            git commit -m "Update modbux-bin to version $VERSION"
            git push
          fi
