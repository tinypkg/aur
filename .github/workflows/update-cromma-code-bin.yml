name: Update cromma-code-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected upstream version. Leave empty to read the mutable latest.json feed."
        required: false
        type: string
      force:
        description: "Force verification and a packaging-only pkgrel bump"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "50 */12 * * *"

concurrency:
  group: aur-cromma-code-bin
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read updater feed
        id: feed
        run: |
          set -euo pipefail

          # https://dl.cromma.ai/code/stable/latest.json is a Tauri updater
          # feed overwritten in place on every release: the artifact URLs are
          # versioned but there is no GitHub release to consult.
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 120 \
              "https://dl.cromma.ai/code/stable/latest.json" \
              --output "$RUNNER_TEMP/latest.json"; then
              break
            fi
            [[ "$attempt" == 5 ]] && {
              echo "latest.json stayed unreachable after $attempt attempts" >&2
              exit 1
            }
            sleep $((attempt * 5))
          done

          jq -e '
            (.version | type == "string" and test("^[0-9]+([.][0-9]+)+$"))
            and (.platforms."linux-x86_64" | type == "object")
          ' "$RUNNER_TEMP/latest.json" >/dev/null

          VERSION=$(jq -er '.version' "$RUNNER_TEMP/latest.json")

          # The feed's sha256 belongs to the AppImage archive, not the deb;
          # record both URLs for the verification step.
          DEB_URL=$(jq -er '.platforms."linux-x86_64".installer' "$RUNNER_TEMP/latest.json")
          [[ "$DEB_URL" == "https://dl.cromma.ai/code/artifacts/${VERSION}/CrommaCode-${VERSION}-linux-amd64.deb" ]] || {
            echo "unexpected deb URL: $DEB_URL" >&2
            exit 1
          }
          APPIMAGE_URL=$(jq -er '.platforms."linux-x86_64".archive' "$RUNNER_TEMP/latest.json")
          APPIMAGE_SHA=$(jq -er '.platforms."linux-x86_64".sha256' "$RUNNER_TEMP/latest.json")
          [[ "$APPIMAGE_SHA" =~ ^[a-f0-9]{64}$ ]] || {
            echo "feed sha256 is malformed" >&2
            exit 1
          }

          CURRENT_VERSION=$(sed -n 's/^pkgver=//p' cromma-code-bin/PKGBUILD)
          CURRENT_REL=$(sed -n 's/^pkgrel=//p' cromma-code-bin/PKGBUILD)
          AUR_VERSION=$(
            curl --fail --silent --show-error --location \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              'https://aur.archlinux.org/rpc/?v=5&type=info&arg=cromma-code-bin' |
              jq -er 'if .resultcount == 0 then "" else .results[0].Version end'
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "appimage_url=$APPIMAGE_URL" >> "$GITHUB_OUTPUT"
          echo "appimage_sha=$APPIMAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_rel=$CURRENT_REL" >> "$GITHUB_OUTPUT"
          echo "aur_version=$AUR_VERSION" >> "$GITHUB_OUTPUT"

      - name: Decide update
        id: compare
        env:
          AUR_VERSION: ${{ steps.feed.outputs.aur_version }}
          CURRENT_VERSION: ${{ steps.feed.outputs.current_version }}
          CURRENT_REL: ${{ steps.feed.outputs.current_rel }}
          FORCE_UPDATE: ${{ inputs.force }}
          LATEST_VERSION: ${{ steps.feed.outputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$AUR_VERSION" ] && dpkg --compare-versions "$AUR_VERSION" gt "$LATEST_VERSION-$CURRENT_REL"; then
            echo "AUR is ahead of the GitHub state; reconcile before publishing" >&2
            exit 1
          fi

          PACKAGE_UPDATE=false
          BUMP_REL=false
          if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]; then
              echo "Refusing downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
            PACKAGE_UPDATE=true
          elif [ "$AUR_VERSION" != "$CURRENT_VERSION-$CURRENT_REL" ]; then
            PACKAGE_UPDATE=true
            echo "Publishing the existing package state to AUR"
          elif [ "${FORCE_UPDATE:-false}" = "true" ]; then
            PACKAGE_UPDATE=true
            BUMP_REL=true
          fi

          echo "package_update=$PACKAGE_UPDATE" >> "$GITHUB_OUTPUT"
          echo "bump_rel=$BUMP_REL" >> "$GITHUB_OUTPUT"

      - name: Verify payloads
        if: steps.compare.outputs.package_update == 'true'
        env:
          VERSION: ${{ steps.feed.outputs.version }}
          APPIMAGE_URL: ${{ steps.feed.outputs.appimage_url }}
          APPIMAGE_SHA: ${{ steps.feed.outputs.appimage_sha }}
        run: |
          set -euo pipefail

          # The feed signs the AppImage archive; verify it first, then accept
          # the deb from the same versioned artifact directory.
          curl --fail --silent --show-error --location \
            --connect-timeout 15 --max-time 1200 \
            "$APPIMAGE_URL" --output "$RUNNER_TEMP/app.AppImage"
          printf '%s  %s\n' "$APPIMAGE_SHA" "$RUNNER_TEMP/app.AppImage" | sha256sum --check

          DEB_URL="https://dl.cromma.ai/code/artifacts/${VERSION}/CrommaCode-${VERSION}-linux-amd64.deb"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 1200 \
              "$DEB_URL" --output "$RUNNER_TEMP/crommacode.deb"; then
              break
            fi
            [[ "$attempt" == 5 ]] && {
              echo "deb stayed unreachable after $attempt attempts" >&2
              exit 1
            }
            sleep $((attempt * 5))
          done

          # dpkg-deb ships on ubuntu-latest runners and handles any internal
          # compression format, so avoid hard-coding control/data members.
          deb_version=$(dpkg-deb --field "$RUNNER_TEMP/crommacode.deb" Version)
          deb_arch=$(dpkg-deb --field "$RUNNER_TEMP/crommacode.deb" Architecture)
          [[ "$deb_version" == "$VERSION" ]] || {
            echo "deb version $deb_version does not match feed version $VERSION" >&2
            exit 1
          }
          [[ "$deb_arch" == "amd64" ]] || {
            echo "deb architecture $deb_arch is not amd64" >&2
            exit 1
          }

          dpkg-deb --fsys-tarfile "$RUNNER_TEMP/crommacode.deb" |
            tar -xf - -C "$RUNNER_TEMP" ./opt/crommacode/bees
          chmod +x "$RUNNER_TEMP/opt/crommacode/bees"
          [[ "$("$RUNNER_TEMP/opt/crommacode/bees" providers 2>/dev/null | head -n1)" != "" ]]

      - name: Stage PKGBUILD
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.feed.outputs.version }}
        run: |
          set -euo pipefail
          cd cromma-code-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(sed -n 's/^pkgrel=//p' PKGBUILD)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          elif [ "$(sed -n 's/^pkgver=//p' PKGBUILD)" != "$LATEST_VERSION" ]; then
            sed -i "s/^pkgver=.*/pkgver=$LATEST_VERSION/" PKGBUILD
            sed -i 's/^pkgrel=.*/pkgrel=1/' PKGBUILD
          fi

      - name: Publish to AUR
        if: steps.compare.outputs.package_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: cromma-code-bin
          pkgbuild: ./cromma-code-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for cromma-code-bin {0}', steps.feed.outputs.version) || format('Update cromma-code-bin to version {0}', steps.feed.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Commit package state
        if: steps.compare.outputs.package_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          VERSION: ${{ steps.feed.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cromma-code-bin/PKGBUILD
          if git diff --cached --quiet; then
            echo "AUR publication required no GitHub metadata change."
            exit 0
          fi
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for cromma-code-bin $VERSION"
          else
            git commit -m "Update cromma-code-bin to version $VERSION"
          fi
          git pull --rebase origin main
          git push
