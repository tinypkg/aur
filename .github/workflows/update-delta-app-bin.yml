name: Update Delta-app-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 0.23.0). Leave empty to auto-detect latest."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-main
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Upstream manifest endpoint returns {"version":..,"url":..}
            MANIFEST=$(curl --fail --silent --show-error --location --retry 3 \
              "https://delta.dev/api/releases/stable/latest/asset?asset=delta&os=linux&arch=x86_64")
            VERSION=$(printf '%s' "$MANIFEST" | jq -er '.version | strings | select(length > 0)')
          fi
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "unexpected version: $VERSION" >&2; exit 1; }
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify both assets exist
        run: |
          set -euo pipefail
          V="${{ steps.get_version.outputs.version }}"
          for a in x86_64 aarch64; do
            STATUS=$(curl --fail --silent --show-error --location --retry 3 -r 0-1023 -o /dev/null -w '%{http_code}' \
              "https://releases.delta.dev/releases/stable/${V}/delta-linux-${a}.tar.gz")
            [ "$STATUS" = "206" ] || [ "$STATUS" = "200" ] || { echo "missing delta-linux-${a}.tar.gz (HTTP $STATUS)" >&2; exit 1; }
          done

      - name: Get current version
        id: current_version
        run: |
          echo "current=$(grep '^pkgver=' delta-app-bin/PKGBUILD | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        env:
          LATEST: ${{ steps.get_version.outputs.version }}
          CURRENT: ${{ steps.current_version.outputs.current }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ "$LATEST" = "$CURRENT" ]; then
            if [ "$FORCE" = "true" ]; then
              echo "needs_update=true" >> $GITHUB_OUTPUT
              echo "bump_rel=true" >> $GITHUB_OUTPUT
            else
              echo "needs_update=false" >> $GITHUB_OUTPUT
            fi
          else
            [[ "$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | head -n1)" == "$CURRENT" ]] || {
              echo "refusing downgrade from $CURRENT to $LATEST" >&2; exit 1; }
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=false" >> $GITHUB_OUTPUT
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cd delta-app-bin
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            sed -i "s/^pkgrel=.*/pkgrel=$((CURRENT_REL + 1))/" PKGBUILD
          else
            sed -i "s/^pkgver=.*/pkgver=${{ steps.get_version.outputs.version }}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add delta-app-bin/PKGBUILD
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            git commit -m "Bump pkgrel for delta-app-bin ${{ steps.get_version.outputs.version }}"
          else
            git commit -m "Update delta-app-bin to version ${{ steps.get_version.outputs.version }}"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: delta-app-bin
          pkgbuild: ./delta-app-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.version) || format('Update to version {0}', steps.get_version.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
