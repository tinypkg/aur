name: Update cc-switch-cli Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 5.2.1). Leave empty to auto-detect latest version."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get latest version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(curl -s https://api.github.com/repos/SaladDay/cc-switch-cli/releases/latest | jq -r '.tag_name' | sed 's/^v//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' cc-switch-cli/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.get_version.outputs.version }}" = "${{ steps.current_version.outputs.current }}" ]; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "needs_update=true" >> $GITHUB_OUTPUT
              echo "bump_rel=true" >> $GITHUB_OUTPUT
              echo "Forcing pkgrel bump for version ${{ steps.get_version.outputs.version }}"
            else
              echo "needs_update=false" >> $GITHUB_OUTPUT
              echo "Version ${{ steps.get_version.outputs.version }} is already up to date"
            fi
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=false" >> $GITHUB_OUTPUT
            echo "Updating from ${{ steps.current_version.outputs.current }} to ${{ steps.get_version.outputs.version }}"
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cd cc-switch-cli
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            # Bump pkgrel for same version fix
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            echo "Bumped pkgrel from $CURRENT_REL to $NEW_REL"
          else
            # New version - update version and reset pkgrel to 1
            sed -i "s/^pkgver=.*/pkgver=${{ steps.get_version.outputs.version }}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Update checksums
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cd cc-switch-cli
          VERSION="${{ steps.get_version.outputs.version }}"

          X64_URL="https://github.com/SaladDay/cc-switch-cli/releases/download/v${VERSION}/cc-switch-cli-linux-x64-musl.tar.gz"
          ARM64_URL="https://github.com/SaladDay/cc-switch-cli/releases/download/v${VERSION}/cc-switch-cli-linux-arm64-musl.tar.gz"

          SHA_X64=$(curl -sL "$X64_URL" | sha256sum | cut -d' ' -f1)
          SHA_ARM64=$(curl -sL "$ARM64_URL" | sha256sum | cut -d' ' -f1)

          # Update source URLs
          sed -i "s|source_x86_64=.*|source_x86_64=(\"\${pkgname}-\${pkgver}.tar.gz::${X64_URL}\")|" PKGBUILD
          sed -i "s|source_aarch64=.*|source_aarch64=(\"\${pkgname}-\${pkgver}.tar.gz::${ARM64_URL}\")|" PKGBUILD

          # Update checksums
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X64}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_ARM64}')/" PKGBUILD

          echo "x86_64: $SHA_X64"
          echo "aarch64: $SHA_ARM64"

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cc-switch-cli/PKGBUILD
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            git commit -m "Bump pkgrel for cc-switch-cli ${{ steps.get_version.outputs.version }}"
          else
            git commit -m "Update cc-switch-cli to version ${{ steps.get_version.outputs.version }}"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: cc-switch-cli
          pkgbuild: ./cc-switch-cli/PKGBUILD
          updpkgsums: false
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.version) || format('Update to version {0}', steps.get_version.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519