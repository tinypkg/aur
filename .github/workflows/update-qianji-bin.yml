name: Update Qianji-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 4.5.2). Leave empty to auto-detect latest release."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

concurrency:
  group: aur-main
  cancel-in-progress: false

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest release info
        id: get_version
        run: |
          set -euo pipefail
          RELEASE_JSON=$(curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/litangtech/Qianji-Linux-Release/releases/latest)
          if [ -n "${{ github.event.inputs.version }}" ]; then
            LATEST_VER="${{ github.event.inputs.version }}"
          else
            LATEST_VER=$(printf '%s' "$RELEASE_JSON" | jq -er '.tag_name | strings | select(length > 0)')
            LATEST_VER="${LATEST_VER#v}"
          fi
          ASSET_NAME=$(printf '%s' "$RELEASE_JSON" | jq -er --arg v "$LATEST_VER" \
            '.assets[] | select(.name | test("_x86_64\\.pkg\\.tar\\.zst$")) | .name')
          ASSET_VER=$(printf '%s' "$ASSET_NAME" | sed -n 's/^qianji_\(.*\)_x86_64\.pkg\.tar\.zst$/\1/p')
          [[ -n "$ASSET_VER" && "$ASSET_VER" != "$ASSET_NAME" ]] || {
            echo "failed to parse asset version from: $ASSET_NAME" >&2; exit 1;
          }
          echo "version=$LATEST_VER" >> $GITHUB_OUTPUT
          echo "assetver=$ASSET_VER" >> $GITHUB_OUTPUT

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VER=$(grep '^pkgver=' qianji-bin/PKGBUILD | cut -d'=' -f2)
          CURRENT_ASSET=$(grep '^_assetver=' qianji-bin/PKGBUILD | cut -d'=' -f2 | tr -d '"')
          echo "current=$CURRENT_VER" >> $GITHUB_OUTPUT
          echo "current_asset=$CURRENT_ASSET" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.get_version.outputs.version }}" != "${{ steps.current_version.outputs.current }}" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=false" >> $GITHUB_OUTPUT
            echo "Updating from ${{ steps.current_version.outputs.current }} to ${{ steps.get_version.outputs.version }}"
          elif [ "${{ steps.get_version.outputs.assetver }}" != "${{ steps.current_version.outputs.current_asset }}" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=true" >> $GITHUB_OUTPUT
            echo "Same version, new build asset ${{ steps.get_version.outputs.assetver }}"
          elif [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=true" >> $GITHUB_OUTPUT
            echo "Forcing pkgrel bump for version ${{ steps.get_version.outputs.version }}"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Version ${{ steps.get_version.outputs.version }} is already up to date"
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          cd qianji-bin
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            sed -i "s/^_assetver=.*/_assetver=\"${{ steps.get_version.outputs.assetver }}\"/" PKGBUILD
            echo "Bumped pkgrel to $NEW_REL for asset ${{ steps.get_version.outputs.assetver }}"
          else
            sed -i "s/^pkgver=.*/pkgver=${{ steps.get_version.outputs.version }}/" PKGBUILD
            sed -i "s/^_assetver=.*/_assetver=\"${{ steps.get_version.outputs.assetver }}\"/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            echo "Updated to version ${{ steps.get_version.outputs.version }}"
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add qianji-bin/PKGBUILD
          if [ "${{ steps.compare.outputs.bump_rel }}" = "true" ]; then
            git commit -m "Bump pkgrel for qianji-bin ${{ steps.get_version.outputs.version }}"
          else
            git commit -m "Update qianji-bin to version ${{ steps.get_version.outputs.version }}"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: qianji-bin
          pkgbuild: ./qianji-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.version) || format('Update to version {0}', steps.get_version.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
