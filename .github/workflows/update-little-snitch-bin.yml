name: Update little-snitch-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number. Leave empty to auto-detect from GitHub Releases."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Get latest version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            TAG=$(curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 --retry 3 \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/obdev/littlesnitch-linux/releases/latest \
              | jq -er '.tag_name')
            VERSION="${TAG##*/}"
          fi

          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' little-snitch-bin/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          CURRENT: ${{ steps.current_version.outputs.current }}
          FORCE_UPDATE: ${{ github.event.inputs.force }}
        run: |
          if [ "$VERSION" = "$CURRENT" ]; then
            if [ "$FORCE_UPDATE" = "true" ]; then
              echo "needs_update=true" >> $GITHUB_OUTPUT
              echo "bump_rel=true" >> $GITHUB_OUTPUT
              echo "Forcing pkgrel bump for version $VERSION"
            else
              echo "needs_update=false" >> $GITHUB_OUTPUT
              echo "Version $VERSION is already up to date"
            fi
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "bump_rel=false" >> $GITHUB_OUTPUT
            echo "Updating from $CURRENT to $VERSION"
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
        run: |
          cd little-snitch-bin
          if [ "$BUMP_REL" = "true" ]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            echo "Bumped pkgrel from $CURRENT_REL to $NEW_REL"
          else
            sed -i "s/^pkgver=.*/pkgver=$VERSION/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add little-snitch-bin/PKGBUILD
          if [ "$BUMP_REL" = "true" ]; then
            git commit -m "Bump pkgrel for little-snitch-bin $VERSION"
          else
            git commit -m "Update little-snitch-bin to version $VERSION"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: little-snitch-bin
          pkgbuild: ./little-snitch-bin/PKGBUILD
          assets: ./little-snitch-bin/little-snitch-bin.install
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.version) || format('Update to version {0}', steps.get_version.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
