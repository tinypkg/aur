name: Update fizzy-cli-bin Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 4.0.1). Leave empty to auto-detect latest version."
        required: false
        type: string
      force:
        description: "Force update even if version is the same (bump pkgrel)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */12 * * *"

jobs:
  update-pkgbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get latest version
        id: get_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION=$(curl -fsSL --retry 3 \
              https://api.github.com/repos/basecamp/fizzy-cli/releases/latest | \
              jq -er '.tag_name | sub("^v"; "")')
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported version format: $VERSION" >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release assets
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          urls=(
            "https://github.com/basecamp/fizzy-cli/releases/download/v${VERSION}/fizzy_${VERSION}_linux_amd64.tar.gz"
            "https://github.com/basecamp/fizzy-cli/releases/download/v${VERSION}/fizzy_${VERSION}_linux_arm64.tar.gz"
          )

          for url in "${urls[@]}"; do
            curl --fail --silent --show-error --location --head \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$url" >/dev/null
          done

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(grep '^pkgver=' fizzy-cli-bin/PKGBUILD | cut -d'=' -f2)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          CURRENT_VERSION: ${{ steps.current_version.outputs.current }}
          FORCE_UPDATE: ${{ github.event.inputs.force }}
          LATEST_VERSION: ${{ steps.get_version.outputs.version }}
          MANUAL_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ -z "$MANUAL_VERSION" && "$LATEST_VERSION" != "$CURRENT_VERSION" ]]; then
            OLDEST_VERSION=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$LATEST_VERSION" | sort -V | head -n1)
            if [[ "$OLDEST_VERSION" != "$CURRENT_VERSION" ]]; then
              echo "Refusing automatic downgrade from $CURRENT_VERSION to $LATEST_VERSION" >&2
              exit 1
            fi
          fi

          if [[ "$LATEST_VERSION" == "$CURRENT_VERSION" ]]; then
            if [[ "$FORCE_UPDATE" == "true" ]]; then
              echo "needs_update=true" >> "$GITHUB_OUTPUT"
              echo "bump_rel=true" >> "$GITHUB_OUTPUT"
              echo "Forcing pkgrel bump for version $LATEST_VERSION"
            else
              echo "needs_update=false" >> "$GITHUB_OUTPUT"
              echo "Version $LATEST_VERSION is already up to date"
            fi
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "bump_rel=false" >> "$GITHUB_OUTPUT"
            echo "Updating from $CURRENT_VERSION to $LATEST_VERSION"
          fi

      - name: Update PKGBUILD version
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          cd fizzy-cli-bin
          if [[ "$BUMP_REL" == "true" ]]; then
            CURRENT_REL=$(grep '^pkgrel=' PKGBUILD | cut -d'=' -f2)
            NEW_REL=$((CURRENT_REL + 1))
            sed -i "s/^pkgrel=.*/pkgrel=$NEW_REL/" PKGBUILD
            echo "Bumped pkgrel from $CURRENT_REL to $NEW_REL"
          else
            sed -i "s/^pkgver=.*/pkgver=${LATEST_VERSION}/" PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true'
        env:
          BUMP_REL: ${{ steps.compare.outputs.bump_rel }}
          LATEST_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fizzy-cli-bin/PKGBUILD
          if [[ "$BUMP_REL" == "true" ]]; then
            git commit -m "Bump pkgrel for fizzy-cli-bin $LATEST_VERSION"
          else
            git commit -m "Update fizzy-cli-bin to version $LATEST_VERSION"
          fi
          git push

      - name: Publish to AUR
        if: steps.compare.outputs.needs_update == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: fizzy-cli-bin
          pkgbuild: ./fizzy-cli-bin/PKGBUILD
          updpkgsums: true
          post_process: bash /github/workspace/.github/scripts/prune-aur-workdir.sh .
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ${{ steps.compare.outputs.bump_rel == 'true' && format('Bump pkgrel for version {0}', steps.get_version.outputs.version) || format('Update to version {0}', steps.get_version.outputs.version) }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
